<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin: ランキング ♠ 不賭死</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-layout { display: flex; flex-direction: column; gap: 2rem; }

    /* 入力フォームカード */
    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2rem;
    }
    .form-card-title {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      letter-spacing: 0.12em;
      color: var(--gold);
      margin-bottom: 1.5rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border);
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem;
      align-items: end;
    }
    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    /* 整理番号検索 */
    .lookup-group { display: flex; gap: 0.5rem; }
    #ticket-lookup-result { font-size: 0.75rem; margin-top: 0.4rem; min-height: 1.2rem; color: var(--text-muted); }

    /* タブ */
    .admin-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      overflow-x: auto;
    }
    .admin-tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.5rem 1.2rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.88rem;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .admin-tab-btn:hover { color: var(--text); background: var(--obsidian-3); }
    .admin-tab-btn.active { border-color: var(--border-gold); color: var(--gold-light); background: var(--gold-dim); }

    /* テーブル */
    .admin-table-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .admin-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    .admin-table th {
      background: var(--obsidian-3);
      color: var(--gold);
      font-weight: 600;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }
    .admin-table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(212,175,55,0.05);
      color: var(--text);
      vertical-align: middle;
    }
    .admin-table tr:last-child td { border-bottom: none; }
    .admin-table tr:hover td { background: rgba(255,255,255,0.015); }

    .rank-cell { font-family: 'Cinzel', serif; font-weight: 700; width: 3rem; text-align: center; }
    .game-cell { font-size: 0.82rem; width: 8rem; }
    .name-cell { font-weight: 500; }
    .score-cell { font-family: 'Cinzel', serif; font-weight: 600; color: var(--gold-light); text-align: right; width: 8rem; }
    .action-cell { text-align: right; width: 9rem; white-space: nowrap; }
    .action-cell button { margin-left: 0.4rem; cursor: pointer; }

    /* フォームボタン行 */
    .form-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 1.5rem;
    }
    .game-picker{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.game-picker button{
  height:60px;
  font-size:1rem;
  font-weight:700;
  cursor:pointer;
  border:1px solid rgba(212,175,55,.3);
  background:#181818;
  color:white;
  border-radius:8px;
}

.game-picker button.active{
  border-color:#d4af37;
  background:rgba(212,175,55,.15);
}
    .score-big{
  height:80px;
  font-size:2rem;
  text-align:center;
  font-weight:700;
}
    .submit-main{
  width:100%;
  height:70px;
  font-size:1.3rem;
  font-weight:700;
}
  </style>
</head>
<body>

<!-- ヘッダー -->
<div style="width:100%; background:var(--obsidian-2); border-bottom:1px solid var(--border); padding:0.75rem 1.5rem; display:flex; justify-content:space-between; align-items:center; box-sizing:border-box;">
  <div style="display:flex; align-items:center; gap:1rem;">
    <span style="font-family:'Cinzel Decorative',serif; color:var(--gold); font-weight:700; font-size:1.1rem;">不賭死 STAFF</span>
    <span style="background:rgba(212,175,55,0.1); border:1px solid var(--border-gold); color:var(--gold); font-size:0.68rem; padding:0.15rem 0.5rem; border-radius:3px; letter-spacing:0.05em;">RANKING MANAGER</span>
  </div>
  <div style="display:flex; gap:0.8rem; align-items:center;">
    <a href="admin-reserve.html" class="btn-gold" style="font-size:0.75rem; padding:0.4rem 0.8rem; background:transparent; border-color:rgba(201,168,76,0.4);">➔ 受付管理へ</a>
    <button onclick="signOutAdmin()" style="font-size:0.75rem; padding:0.4rem 0.8rem; background:transparent; border:1px solid rgba(231,76,60,0.5); color:var(--red-bright); border-radius:4px; cursor:pointer;">ログアウト</button>
  </div>
</div>

<div class="container" style="padding:2rem 1rem 5rem;">
  <div class="admin-layout">

  <!-- スコア登録フォーム -->
<div class="form-card">
  <div class="form-card-title" id="form-mode-label">
    ▸ 新規スコア登録
  </div>

  <input type="hidden" id="edit-id">
  <input type="hidden" id="f-game">

  <div class="form-grid">

    <!-- 整理番号 -->
    <div class="form-group">
      <label class="form-label">
        整理番号
      </label>

      <div class="lookup-group">
        <input
          type="text"
          id="f-ticket"
          class="form-input"
          placeholder="例: 001"
          autocomplete="off"
          inputmode="numeric">

        <button
          type="button"
          onclick="lookupTicket()"
          class="btn-gold">
          参照
        </button>
      </div>

      <div id="ticket-lookup-result"></div>
    </div>

    <!-- ゲーム表示 -->
    <div class="form-group">
      <label class="form-label">
        ゲーム
      </label>

      <input
        type="text"
        id="game-display"
        class="form-input"
        readonly
        placeholder="整理番号参照で自動入力">
    </div>

    <!-- 名前 -->
    <div class="form-group">
      <label class="form-label">
        プレイヤー名
      </label>

      <input
        type="text"
        id="f-name"
        class="form-input"
        maxlength="12"
        readonly>
    </div>

    <!-- 得点 -->
    <div class="form-group">
      <label class="form-label">
        獲得スコア
      </label>

      <input
        type="number"
        id="f-score"
        class="form-input score-big"
        placeholder="0"
        min="0"
        inputmode="numeric">
    </div>

  </div>

  <div class="form-actions">

    <button
      type="button"
      id="cancel-btn"
      onclick="resetForm()"
      class="btn-gold"
      style="display:none;">
      キャンセル
    </button>

    <button
      id="submit-btn"
      type="button"
      onclick="doSubmit()"
      class="btn-gold submit-main">
      <span id="submit-label">登録する</span>
    </button>

  </div>
</div>

<!-- ランキング一覧 -->
    <div>
      <div class="admin-tabs" id="tab-container"></div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th class="rank-cell">順位</th>
              <th class="game-cell">ゲーム</th>
              <th class="name-cell">プレイヤー名</th>
              <th class="score-cell" style="text-align:right;">スコア</th>
              <th class="action-cell">操作</th>
            </tr>
          </thead>
          <tbody id="ranking-tbody">
            <tr><td colspan="5" style="text-align:center; color:var(--text-muted); padding:2rem;">データを読み込み中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- 削除確認モーダル -->
<div class="modal-overlay" id="del-modal">
  <div class="modal">
    <h3>⚠️ スコアデータの削除</h3>
    <p style="font-size:0.88rem; color:var(--text); margin-bottom:0.5rem;">以下のランキングデータを完全に削除しますか？</p>
    <div id="del-target-info" style="font-size:0.9rem; font-weight:600; color:var(--crimson-hot); background:rgba(0,0,0,0.2); padding:0.6rem; border-radius:4px; margin-bottom:1.5rem;">—</div>
    <div class="modal-actions">
      <button onclick="closeDelModal()" class="btn-gold" style="background:transparent; border-color:var(--border); color:var(--text-muted); padding:0.4rem 1rem; font-size:0.8rem;">やめる</button>
      <button onclick="confirmDelete()" class="btn-gold" style="background:var(--crimson); border-color:var(--crimson-hot); color:#fff; padding:0.4rem 1rem; font-size:0.8rem;">削除する</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="common.js"></script>
<script>
  requireRole('staff');

  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  let allDocs = [];
  let currentTab = GAMES[0].id; // 最初のゲームタブをデフォルトに（総合なし）
  let delId = null;
 function setGame(btn, gameId){

  document.getElementById('f-game').value = gameId;

  document
    .querySelectorAll('.game-picker button')
    .forEach(b => b.classList.remove('active'));

  btn.classList.add('active');

  document.getElementById('f-name').focus();
}
  window.addEventListener('DOMContentLoaded', () => {
    // タブ生成（総合タブなし）
    const tabsWrap = document.getElementById('tab-container');
    tabsWrap.innerHTML = GAMES.map((g, i) =>
      `<button class="admin-tab-btn id-tab-${g.id} ${i === 0 ? 'active' : ''}" onclick="switchTab('${g.id}')">${g.icon} ${g.label}</button>`
    ).join('');

    // データ監視
    db.collection('rankings').orderBy('score', 'desc').onSnapshot(snap => {
      allDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderTable();
    }, err => {
      console.error(err);
      document.getElementById('ranking-tbody').innerHTML =
        `<tr><td colspan="5" style="text-align:center; color:var(--red-bright); padding:2rem;">データの読み込み権限がありません</td></tr>`;
    });
  });

  function switchTab(gameId) {
    currentTab = gameId;
    document.querySelectorAll('.admin-tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.id-tab-${gameId}`)?.classList.add('active');
    renderTable();
  }

  function renderTable() {
    const tbody = document.getElementById('ranking-tbody');
    const filtered = allDocs.filter(d => d.gameId === currentTab);

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted); padding:2rem;">まだスコアデータはありません</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map((it, i) => {
      const g = GAMES.find(x => x.id === it.gameId);
      return `<tr>
        <td class="rank-cell">${rankDisplay(i + 1)}</td>
        <td class="game-cell">${g ? g.icon + ' ' + g.label : esc(it.gameId)}</td>
        <td class="name-cell">${esc(it.name) || '—'}</td>
        <td class="score-cell">${(it.score || 0).toLocaleString()} pt</td>
        <td class="action-cell">
          <button onclick="editForm('${esc(it.id)}')" class="btn-gold" style="font-size:0.7rem; padding:0.2rem 0.5rem; background:transparent;">編集</button>
          <button onclick="openDelModal('${esc(it.id)}', '${esc(it.name)}', ${it.score})" class="btn-gold" style="font-size:0.7rem; padding:0.2rem 0.5rem; background:transparent; border-color:rgba(231,76,60,0.4); color:var(--red-bright);">削除</button>
        </td>
      </tr>`;
    }).join('');
  }

  // 整理番号から呼出
  async function lookupTicket() {
    const val = document.getElementById('f-ticket').value.trim();
    const resultEl = document.getElementById('ticket-lookup-result');
    if (!val) { resultEl.textContent = '番号を入力してください'; return; }

    resultEl.textContent = '検索中...';
    try {
      const snap = await db.collection('reserveHistory')
        .where('ticketId', '==', val.padStart(3, '0'))
        .limit(1).get();

      if (snap.empty) {
        resultEl.innerHTML = '<span style="color:var(--red-bright)">❌ 見つかりません</span>';
        return;
      }
      const data = snap.docs[0].data();
      resultEl.innerHTML = `<span style="color:#27ae60">✓ ${esc(data.nickname)}さん</span>`;
      document.getElementById('f-game').value = data.gameId || '';
      document.getElementById('f-name').value = data.nickname || '';
      document.getElementById('f-score').focus();
    } catch(e) {
      resultEl.innerHTML = '<span style="color:var(--red-bright)">エラーが発生しました</span>';
    }
  }

  // Enterキーで参照
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('f-ticket').addEventListener('keydown', e => {
      if (e.key === 'Enter') lookupTicket();
    });
    document.getElementById('f-score').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSubmit();
    });
  });

  let submitting = false;

async function doSubmit() {

  if (submitting) return;
  submitting = true;

  const submitBtn = document.getElementById('submit-btn');

  if (submitBtn) {
    submitBtn.disabled = true;
  }

  try {

    const editId = document.getElementById('edit-id').value;
    const gameId = document.getElementById('f-game').value;
    const name   = document.getElementById('f-name').value.trim();
    const score  = parseInt(document.getElementById('f-score').value, 10);

    if (!gameId || !name || isNaN(score) || score < 0) {
      alert('必須項目を入力してください');
      return;
    }

    const payload = {
      gameId,
      name,
      score,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    if (editId) {

      await db.collection('rankings')
        .doc(editId)
        .update(payload);

      showToast('スコアを更新しました');

    } else {

      await db.collection('rankings')
        .add({
          ...payload,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

      showToast('スコアを登録しました');

      switchTab(gameId);
    }

    resetForm();

    document.getElementById('f-ticket')?.focus();

  } catch (e) {

    alert('保存失敗: ' + e.message);

  } finally {

    submitting = false;

    if (submitBtn) {
      submitBtn.disabled = false;
    }
  }
}
  function editForm(id) {
    const target = allDocs.find(d => d.id === id);
    if (!target) return;
    document.getElementById('edit-id').value  = target.id;
    document.getElementById('f-ticket').value = '';
    document.getElementById('f-game').value   = target.gameId || '';
    document.getElementById('f-name').value   = target.name || '';
    document.getElementById('f-score').value  = target.score || 0;
    document.getElementById('ticket-lookup-result').textContent = '';
    document.getElementById('form-mode-label').textContent = '📝 スコアデータの編集';
    document.getElementById('submit-label').textContent = '更新する';
    document.getElementById('cancel-btn').style.display = 'inline-flex';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm() {
    ['edit-id','f-ticket','f-name','f-score'].forEach(id => { document.getElementById(id).value = ''; });
    document.getElementById('f-game').value = '';
    document.getElementById('ticket-lookup-result').textContent = '';
    document.getElementById('form-mode-label').textContent = '▸ 新規スコア登録';
    document.getElementById('submit-label').textContent = '登録する';
    document.getElementById('cancel-btn').style.display = 'none';
  }

  function openDelModal(id, name, score) {
    delId = id;
    document.getElementById('del-target-info').textContent = `「${name}」 — ${Number(score).toLocaleString()} pt`;
    document.getElementById('del-modal').classList.add('open');
  }
  function closeDelModal() {
    delId = null;
    document.getElementById('del-modal').classList.remove('open');
  }
  async function confirmDelete() {
    if (!delId) return;
    try {
      await db.collection('rankings').doc(delId).delete();
      showToast('データを削除しました');
      closeDelModal();
    } catch(e) {
      alert('削除に失敗しました: ' + e.message);
    }
  }
</script>
</body>
</html>
