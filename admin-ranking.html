<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin: ランキング ♠ 不賭死</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-layout { display: flex; flex-direction: column; gap: 2rem; }

    /* 入力フォームカード */
   .form-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:1.8rem;
  position:relative;
  overflow:hidden;
}

.form-card::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at top right,
      rgba(212,175,55,.08),
      transparent 45%);
  pointer-events:none;
}
   .form-input{
  width:100%;
  background:rgba(255,255,255,.05);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text);
  padding:.7rem 1rem;
  transition:.2s;
}

.form-input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(212,175,55,.12);
}
    .form-card-title{
  font-family:'Cinzel',serif;
  font-size:.88rem;
  letter-spacing:.12em;
  color:var(--gold);
  margin-bottom:1.4rem;
  padding-bottom:.7rem;
  border-bottom:1px solid var(--border);

  display:flex;
  align-items:center;
  justify-content:space-between;
}
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem;
      align-items: end;
    }
    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    /* 整理番号検索 */
    .lookup-group { display: flex; gap: 0.5rem; }
    #ticket-lookup-result { font-size: 0.75rem; margin-top: 0.4rem; min-height: 1.2rem; color: var(--text-muted); }

    /* タブ */
    .admin-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      overflow-x: auto;
    }
   .admin-tab-btn{
  border:2px solid var(--border);
  border-radius:8px;

  padding:.75rem 1rem;

  transition:.15s;
}

.admin-tab-btn.active{
  border-color:var(--gold);

  background:rgba(212,175,55,.1);

  color:var(--gold);

  box-shadow:
    0 0 12px rgba(212,175,55,.15);
}
    /* テーブル */
    .admin-table-wrap{
  background:var(--bg-card);

  border:1px solid var(--border);

  border-radius:10px;

  overflow:hidden;
}
    .admin-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    .admin-table th {
      background: var(--obsidian-3);
      color: var(--gold);
      font-weight: 600;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }
    .admin-table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(212,175,55,0.05);
      color: var(--text);
      vertical-align: middle;
    }
    .admin-table tr:last-child td { border-bottom: none; }
    .admin-table tr:hover td{
  background:
    rgba(212,175,55,.05);
}
    .rank-cell{
  font-family:'Cinzel Decorative',serif;
  font-size:1.15rem;
  font-weight:900;
}
    .game-cell { font-size: 0.82rem; width: 8rem; }
    .name-cell { font-weight: 500; }
    .score-cell { font-family: 'Cinzel', serif; font-weight: 600; color: var(--gold-light); text-align: right; width: 8rem; }
   .action-cell button{
  padding:.35rem .7rem;
  border-radius:5px;
  transition:.15s;
}

.action-cell button:hover{
  transform:translateY(-1px);
}
    /* フォームボタン行 */
    .form-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 1.5rem;
    }
  .score-big{
  height:100px;

  font-size:3rem;
  font-family:'Cinzel Decorative',serif;
  font-weight:900;

  text-align:center;

  color:var(--gold);

  border:2px solid rgba(212,175,55,.3);

  background:
    linear-gradient(
      to bottom,
      rgba(212,175,55,.08),
      rgba(212,175,55,.02)
    );

  text-shadow:0 0 20px rgba(212,175,55,.25);
}
   .submit-main{
  height:64px;

  font-family:'Cinzel',serif;
  font-size:1rem;
  font-weight:700;

  letter-spacing:.08em;

  transition:.2s;
}

.submit-main:hover{
  transform:translateY(-1px);

  box-shadow:
    0 0 20px rgba(212,175,55,.18);
}
/* =========================
   ADMIN HEADER
========================= */

.admin-header{
  position:sticky;
  top:0;
  z-index:100;
  backdrop-filter:blur(16px);

  background:rgba(10,10,12,.92);

  border-bottom:1px solid rgba(212,175,55,.15);

  box-shadow:
    0 8px 32px rgba(0,0,0,.35);
}

.admin-header .header-inner{
  max-width:1400px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:2rem;

  padding:1rem 2rem;
}

/* 左 */

.admin-brand{
  display:flex;
  align-items:center;
  gap:1rem;
}

.admin-badges{
  display:flex;
  gap:.5rem;
}

.staff-badge,
.manager-badge{
  font-size:.65rem;
  letter-spacing:.12em;
  padding:.3rem .65rem;
  border-radius:999px;
  font-weight:700;
}

.staff-badge{
  color:var(--gold);

  border:1px solid rgba(212,175,55,.3);

  background:
    rgba(212,175,55,.08);
}

.manager-badge{
  color:#5dbb7a;

  border:1px solid rgba(93,187,122,.3);

  background:
    rgba(93,187,122,.08);
}

/* 中央ナビ */

.admin-header .site-nav{
  display:flex;
  gap:.4rem;
}

.admin-header .nav-link{
  padding:.65rem 1rem;

  border-radius:8px;

  font-size:.82rem;

  letter-spacing:.08em;

  transition:.2s;
}

.admin-header .nav-link:hover{
  background:
    rgba(212,175,55,.08);
}

.admin-header .nav-link.active{
  color:var(--gold);

  background:
    rgba(212,175,55,.12);

  border:1px solid rgba(212,175,55,.2);

  box-shadow:
    0 0 15px rgba(212,175,55,.12);
}

/* 右 */

.admin-actions{
  display:flex;
  align-items:center;
  gap:.75rem;
}

.admin-switch-btn{
  text-decoration:none;

  color:var(--gold);

  border:1px solid rgba(212,175,55,.25);

  background:
    rgba(212,175,55,.08);

  padding:.65rem 1rem;

  border-radius:8px;

  font-size:.8rem;

  transition:.2s;
}

.admin-switch-btn:hover{
  transform:translateY(-1px);

  box-shadow:
    0 0 18px rgba(212,175,55,.15);
}

.admin-logout-btn{
  border:1px solid rgba(231,76,60,.35);

  background:
    rgba(231,76,60,.08);

  color:var(--red-bright);

  padding:.65rem 1rem;

  border-radius:8px;

  cursor:pointer;

  transition:.2s;
}

.admin-logout-btn:hover{
  background:
    rgba(231,76,60,.18);
}

/* モバイル */

@media (max-width:1000px){

  .admin-header .header-inner{
    flex-direction:column;
    gap:1rem;
  }

  .admin-brand{
    flex-direction:column;
  }

  .admin-badges{
    justify-content:center;
  }

  .admin-actions{
    width:100%;
    justify-content:center;
  }
}
  </style>
</head>
<body>
<header class="site-header admin-header">
  <div class="header-inner">

    <div class="admin-brand">
      <a class="site-logo" href="index.html">不賭死</a>

      <div class="admin-badges">
        <span class="staff-badge">STAFF</span>
        <span class="manager-badge">RANKING MANAGER</span>
      </div>
    </div>

    <nav class="site-nav">
      <a class="nav-link" href="index.html">TOP</a>
      <a class="nav-link" href="ranking.html">RANKING</a>

      <a class="nav-link active" href="admin-ranking.html">
        SCORE
      </a>

      <a class="nav-link" href="admin-reserve.html">
        RECEPTION
      </a>
    </nav>

    <div class="admin-actions">
      <a href="admin-reserve.html" class="admin-switch-btn">
        🎟 受付管理
      </a>

      <button class="admin-logout-btn" onclick="signOutAdmin()">
        ログアウト
      </button>
    </div>

  </div>
</header>

<div class="container">

  <h1 class="page-title">ランキング管理</h1>
  <p class="page-subtitle">スコア登録・編集</p>

  <div class="divider"></div>
  <div class="admin-layout">

  <!-- スコア登録フォーム -->
<div class="form-card">
  <div class="form-card-title">
    <span id="form-mode-label">🎯 スコア登録（Enter専用）</span>
    <span id="selected-game-badge">---</span>
  </div>

  <input type="hidden" id="edit-id">
  <input type="hidden" id="f-game">

  <div class="form-grid">

    <!-- 整理番号 -->
    <div class="form-group">
      <label>整理番号</label>
      <input
        type="text"
        id="f-ticket"
        class="form-input"
        placeholder="001"
        inputmode="numeric"
        autocomplete="off">
      <div id="ticket-lookup-result"></div>
    </div>

    <!-- ゲーム -->
    <div class="form-group">
      <label>ゲーム</label>
      <input type="text" id="game-display" class="form-input" readonly>
    </div>

    <!-- 名前 -->
    <div class="form-group">
      <label>プレイヤー名</label>
      <input type="text" id="f-name" class="form-input" readonly>
    </div>

    <!-- スコア -->
    <div class="form-group">
      <label>スコア（Enterで登録）</label>
      <input
        type="number"
        id="f-score"
        class="form-input score-big"
        placeholder="0"
        min="0">
    </div>

  </div>
</div>
  <div class="form-actions">

    <button
      type="button"
      id="cancel-btn"
      onclick="resetForm()"
      class="btn-gold"
      style="display:none;">
      キャンセル
    </button>
  </div>
</div>

<!-- ランキング一覧 -->
    <div>
      <div class="admin-tabs" id="tab-container"></div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th class="rank-cell">順位</th>
              <th class="game-cell">ゲーム</th>
              <th class="name-cell">プレイヤー名</th>
              <th class="score-cell" style="text-align:right;">スコア</th>
              <th class="action-cell">操作</th>
            </tr>
          </thead>
          <tbody id="ranking-tbody">
            <tr><td colspan="5" style="text-align:center; color:var(--text-muted); padding:2rem;">データを読み込み中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- 削除確認モーダル -->
<div class="modal-overlay" id="del-modal">
  <div class="modal">
    <h3>⚠️ スコアデータの削除</h3>
    <p style="font-size:0.88rem; color:var(--text); margin-bottom:0.5rem;">以下のランキングデータを完全に削除しますか？</p>
    <div id="del-target-info" style="font-size:0.9rem; font-weight:600; color:var(--crimson-hot); background:rgba(0,0,0,0.2); padding:0.6rem; border-radius:4px; margin-bottom:1.5rem;">—</div>
    <div class="modal-actions">
      <button onclick="closeDelModal()" class="btn-gold" style="background:transparent; border-color:var(--border); color:var(--text-muted); padding:0.4rem 1rem; font-size:0.8rem;">やめる</button>
      <button onclick="confirmDelete()" class="btn-gold" style="background:var(--crimson); border-color:var(--crimson-hot); color:#fff; padding:0.4rem 1rem; font-size:0.8rem;">削除する</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="common.js"></script>
<script>
<script>
let allDocs = [];
let currentTab = GAMES[0].id;
let delId = null;

let step = 0;
let submitting = false;

/* =========================
   初期化
========================= */
window.addEventListener('DOMContentLoaded', () => {

  const ticket = document.getElementById('f-ticket');
  const score  = document.getElementById('f-score');

  ticket.focus();

  /* データ監視 */
  db.collection('rankings')
    .orderBy('score', 'desc')
    .onSnapshot(snap => {
      allDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderTable();
    });

  /* =========================
     Enter完全制御（唯一）
  ========================= */
  document.addEventListener('keydown', async (e) => {

    if (e.key !== 'Enter') return;
    e.preventDefault();

    if (submitting) return;

    // STEP 0: 整理番号 → 検索
    if (step === 0) {
      await lookupTicket();
      step = 1;

      const scoreInput = document.getElementById('f-score');
      scoreInput.focus();
      scoreInput.select();
      return;
    }

    // STEP 1: スコア → 登録
    if (step === 1) {
      submitting = true;

      try {
        await doSubmit();
        resetForm();

        step = 0;
        document.getElementById('f-ticket').focus();

      } finally {
        submitting = false;
      }
    }
  });

});


/* =========================
   lookup
========================= */
async function lookupTicket() {
  const val = document.getElementById('f-ticket').value.trim();
  const resultEl = document.getElementById('ticket-lookup-result');

  if (!val) {
    resultEl.textContent = '番号を入力してください';
    return;
  }

  resultEl.textContent = '検索中...';

  try {
    const snap = await db.collection('reserveHistory')
      .where('ticketId', '==', val.padStart(3, '0'))
      .limit(1)
      .get();

    if (snap.empty) {
      resultEl.innerHTML = '<span style="color:red">❌ 見つかりません</span>';
      return;
    }

    const data = snap.docs[0].data();

    resultEl.innerHTML = `<span style="color:green">✓ ${data.nickname} さん</span>`;

    document.getElementById('f-game').value = data.gameId || '';
    document.getElementById('f-name').value = data.nickname || '';

  } catch (e) {
    resultEl.innerHTML = '<span style="color:red">エラー</span>';
  }
}


/* =========================
   submit
========================= */
async function doSubmit() {

  const editId = document.getElementById('edit-id').value;
  const gameId = document.getElementById('f-game').value;
  const name   = document.getElementById('f-name').value.trim();
  const score  = parseInt(document.getElementById('f-score').value, 10);

  if (!gameId || !name || isNaN(score) || score < 0) {
    submitting = false;
    return;
  }

  const payload = {
    gameId,
    name,
    score,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  if (editId) {
    await db.collection('rankings').doc(editId).update(payload);
  } else {
    await db.collection('rankings').add({
      ...payload,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }
}


/* =========================
   reset
========================= */
function resetForm() {
  document.getElementById('edit-id').value = '';
  document.getElementById('f-ticket').value = '';
  document.getElementById('f-name').value = '';
  document.getElementById('f-score').value = '';
  document.getElementById('f-game').value = '';
  document.getElementById('ticket-lookup-result').textContent = '';
  step = 0;
}


/* =========================
   table / delete / edit
   ※ここはそのままでOK
========================= */
</script>
</script>
</body>
</html>
