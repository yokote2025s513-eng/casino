<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin: 受付 ♠ 不死賭</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── セクション構造 ── */
    .ops-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 1.5rem; }
    @media (max-width: 900px) { .ops-grid { grid-template-columns: 1fr; } }

    /* 来場者カウンター */
    .visitor-counter-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .visitor-counter-card::before {
      content: '♟';
      position: absolute;
      font-size: 8rem;
      opacity: 0.03;
      right: -1rem; bottom: -2rem;
    }
    .vc-label { font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 0.08em; color: var(--text-muted); }
    .vc-number { font-family: 'Cinzel', serif; font-size: 3.2rem; font-weight: 700; color: var(--gold-light); margin: 0.6rem 0; text-shadow: 0 0 20px var(--gold-dim); }
    .vc-actions { display: flex; gap: 0.4rem; justify-content: center; position: relative; z-index: 2; }

    /* 受付専用カードに調整 */
    .reserve-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
    }
    .rc-title { font-size: 0.9rem; color: var(--gold); font-weight: 700; margin-bottom: 1.2rem; letter-spacing: 0.05em; }
    .rc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.8rem; }
    
    .game-issue-btn {
      background: var(--obsidian-3); border: 1px solid var(--border); border-radius: 6px;
      padding: 1rem; text-align: center; cursor: pointer; transition: all 0.2s ease;
    }
    .game-issue-btn:hover { border-color: var(--gold); background: var(--gold-dim); }
    .gib-icon { font-size: 1.5rem; display: block; margin-bottom: 0.3rem; }
    .gib-label { font-size: 0.85rem; font-weight: 500; color: var(--text-warm); }

    /* 履歴エリア */
    .history-card { margin-top: 2rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 2rem; position: relative; }
    .history-card::before { content: '♞'; position: absolute; font-size: 12rem; opacity: 0.015; right: 2rem; bottom: -1rem; pointer-events: none; }
    .history-card-title { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--gold); letter-spacing: 0.1em; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.8rem; }
    .history-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.2rem; }
    @media (max-width: 990px) { .history-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) { .history-grid { grid-template-columns: 1fr; } }
    .history-group { background: var(--obsidian-2); border: 1px solid rgba(212,175,55,0.08); border-radius: 6px; padding: 1rem; }
    .hg-title { font-size: 0.85rem; font-weight: 700; color: var(--gold-pale); border-bottom: 1px solid rgba(212,175,55,0.08); padding-bottom: 0.5rem; margin-bottom: 0.8rem; display: flex; justify-content: space-between; }
  </style>
</head>
<body>

<div class="container">
  <h1 class="page-title">受付・整理番号管理</h1>

  <div class="ops-grid">
    <div class="visitor-counter-card">
      <div class="vc-label">TOTAL VISITORS</div>
      <div class="vc-number" id="visitor-val">0</div>
      <div class="vc-actions">
        <button class="btn btn-outline btn-sm" onclick="adjustVisitor(-1)" style="min-width:44px;">-1</button>
        <button class="btn btn-sm" onclick="adjustVisitor(1)" style="min-width:54px;">+1</button>
        <button class="btn btn-outline btn-sm" onclick="resetVisitor()" style="color:var(--crimson-hot); border-color:rgba(184,0,0,0.3); margin-left:8px;">Reset</button>
      </div>
    </div>

    <div class="reserve-card">
      <div class="rc-title">▸ 整理番号の即時発行（ゲームを選択）</div>
      <div class="rc-grid" id="reserve-grid"></div>
    </div>
  </div>

  <div class="history-card">
    <div class="history-card-title">Reservation History</div>
    <div id="history-wrap"></div>
  </div>
</div>

<div class="modal-overlay" id="nick-modal">
  <div class="modal">
    <h3 id="modal-game-title">ニックネーム入力</h3>
    <div class="form-group" style="margin-top:1rem;">
      <input type="text" id="nick-input" placeholder="参加者のニックネーム" autocomplete="off" style="width:100%; box-sizing:border-box;">
      <div class="err-msg" id="nick-err" style="margin-top:0.4rem;"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline btn-sm" onclick="closeNickModal()">キャンセル</button>
      <button class="btn btn-sm" onclick="submitReservation()">番号を発行する</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="ticket-modal">
  <div class="modal" style="text-align:center; max-width:360px;">
    <div style="font-size:0.8rem; color:var(--gold);">受付完了 / 整理券番号</div>
    <div style="font-size:4rem; font-family:'Cinzel',serif; font-weight:700; color:var(--text); margin:1rem 0;" id="ticket-num-val">000</div>
    <div style="font-size:1.1rem; color:var(--gold-light); margin-bottom:1.5rem;" id="ticket-name-val">👤 ゲスト</div>
    <button class="btn btn-sm" onclick="closeTicketModal()" style="width:100%;">次へ進む</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script src="auth.js"></script>

<script>
  requireRole('staff');

  let selectedGame = null;
  let globalNext = 1;

  document.addEventListener('DOMContentLoaded', () => {
    // ゲーム選択用カードの生成
    const grid = document.getElementById('reserve-grid');
    grid.innerHTML = GAMES.map(g => `
      <div class="game-issue-btn" onclick="openNickModal('${g.id}')">
        <span class="gib-icon">${g.icon}</span>
        <span class="gib-label">${g.label}</span>
      </div>
    `).join('');

    // 来場者数のリアルタイム監視
    db.collection('visitors').doc('total').onSnapshot(doc => {
      if(doc.exists) {
        document.getElementById('visitor-val').textContent = doc.data().count ?? 0;
      }
    });

    // 次の整理番号連番の監視
    db.collection('reserves').doc('global').onSnapshot(doc => {
      if(doc.exists) { globalNext = doc.data().next ?? 1; }
    });

    // 履歴のリアルタイム監視
    db.collection('reserveHistory')
      .orderBy('issuedAt', 'desc')
      .onSnapshot(snap => {
        renderHistory(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      });
  });

  // 来場者数操作
  async function adjustVisitor(amount) {
    const ref = db.collection('visitors').doc('total');
    await db.runTransaction(async tx => {
      const snap = await tx.get(ref);
      const cur = snap.exists ? (snap.data().count ?? 0) : 0;
      tx.set(ref, { count: Math.max(0, cur + amount), updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
    });
  }

  async function resetVisitor() {
    if(!confirm('来場者数を 0 にリセットしますか？')) return;
    await db.collection('visitors').doc('total').set({ count: 0, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
  }

  // モーダル制御
  function openNickModal(gameId) {
    selectedGame = gameId;
    const g = GAMES.find(x => x.id === gameId);
    document.getElementById('modal-game-title').textContent = `${g.icon} ${g.label} 受付`;
    document.getElementById('nick-input').value = '';
    document.getElementById('nick-err').textContent = '';
    document.getElementById('nick-modal').classList.add('open');
    setTimeout(() => document.getElementById('nick-input').focus(), 200);
  }

  function closeNickModal() {
    document.getElementById('nick-modal').classList.remove('open');
    selectedGame = null;
  }

  // 整理番号の発行処理
  async function submitReservation() {
    const nick = document.getElementById('nick-input').value.trim();
    const err = document.getElementById('nick-err');
    if(!nick) { err.textContent = 'ニックネームを入力してください'; return; }

    const gameId = selectedGame;
    const ticketId = String(globalNext).padStart(3, '0');

    try {
      const batch = db.batch();
      // 連番のインクリメント
      batch.set(db.collection('reserves').doc('global'), { next: globalNext + 1 }, { merge: true });
      // 履歴追加
      batch.set(db.collection('reserveHistory').doc(), {
        gameId, ticketId, nickname: nick, done: false, source: 'admin',
        issuedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      // 受付時に自動で来場者数を+1
      const visitorRef = db.collection('visitors').doc('total');
      batch.set(visitorRef, { count: firebase.firestore.FieldValue.increment(1), updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });

      await batch.commit();
      closeNickModal();

      // 発行完了ポップアップ
      document.getElementById('ticket-num-val').textContent = ticketId;
      document.getElementById('ticket-name-val').textContent = `👤 ${nick}`;
      document.getElementById('ticket-modal').classList.add('open');

    } catch(e) {
      err.textContent = `エラー: ${e.message}`;
    }
  }

  function closeTicketModal() {
    document.getElementById('ticket-modal').classList.remove('open');
  }

  // 元の美しさを保った履歴描画
  function renderHistory(list) {
    const wrap = document.getElementById('history-wrap');
    const groups = {};
    GAMES.forEach(g => groups[g.id] = []);
    list.forEach(it => { if(groups[it.gameId]) groups[it.gameId].push(it); });

    try {
      wrap.innerHTML = `<div class="history-grid">
        ${GAMES.map(g => `
          <div class="history-group">
            <div class="hg-title">
              <span>${g.icon} ${g.label}</span>
              <span class="count-chip">${groups[g.id].length}組</span>
            </div>
            <div style="max-height:300px; overflow-y:auto; padding-right:2px;">
              ${groups[g.id].length === 0
                ? '<span style="color:var(--text-muted);font-size:0.78rem;">なし</span>'
                : groups[g.id].map(it => `
                  <div style="display:flex;align-items:center;gap:0.4rem;margin-bottom:0.35rem;">
                    <span class="ticket-badge game-${it.gameId}" style="margin:0;min-width:2.5rem;text-align:center">${it.ticketId}</span>
                    <span style="font-size:0.82rem;flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${it.nickname || '—'}</span>
                    <button onclick="deleteHistoryItem('${it.id}')"
                      style="font-size:0.65rem;padding:0.15rem 0.45rem;border:1px solid rgba(231,76,60,0.4);border-radius:3px;background:transparent;color:var(--red-bright);cursor:pointer;">削除</button>
                  </div>
                `).join('')}
            </div>
          </div>`).join('')}
      </div>`;
    } catch(e) {
      wrap.innerHTML = `<div style="color:var(--red-bright);font-size:0.8rem;">エラー: ${e.message}</div>`;
    }
  }

  async function deleteHistoryItem(id) {
    if(!confirm('この受付履歴を削除しますか？')) return;
    await db.collection('reserveHistory').doc(id).delete();
  }
</script>
</body>
</html>
