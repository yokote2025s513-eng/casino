<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casino Night ♠ 文化祭</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── ヒーロー ── */
    .hero {
      text-align: center;
      padding: 3.5rem 1rem 2rem;
      position: relative;
    }
    .hero-eyebrow {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.8rem;
    }
    .hero-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 40px rgba(212,175,55,0.5), 0 0 80px rgba(212,175,55,0.2);
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }
    .hero-sub {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      color: var(--text-muted);
      letter-spacing: 0.2em;
    }
    .suits-row {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      font-size: 1.8rem;
      margin: 1.2rem 0;
      opacity: 0.6;
    }

    /* ── ゲームナビ ── */
    .game-links { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2.5rem; }
    @media (max-width: 700px) { .game-links { grid-template-columns: repeat(2, 1fr); } }
    .game-link-card {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.5rem;
      padding: 1.5rem 0.5rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.25s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .game-link-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: var(--game-color, var(--gold));
      transform: scaleX(0);
      transition: transform 0.25s;
    }
    .game-link-card:hover::after { transform: scaleX(1); }
    .game-link-card:hover {
      border-color: var(--game-color, var(--gold));
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      transform: translateY(-2px);
    }
    .game-icon { font-size: 2.2rem; line-height: 1; }
    .game-name {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      color: var(--game-color, var(--gold));
    }

    /* ── セクションタイトル ── */
    .section-head {
      display: flex; align-items: center; gap: 0.8rem;
      margin-bottom: 1.2rem;
    }
    .section-head h2 {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      letter-spacing: 0.15em;
      color: var(--gold);
    }
    .section-line { flex: 1; height: 1px; background: var(--border); }

    /* ── 待ち時間 ── */
    .wait-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2.5rem; }
    @media (max-width: 700px) { .wait-grid { grid-template-columns: repeat(2, 1fr); } }
    .wait-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.2rem;
      display: flex; flex-direction: column; align-items: center; gap: 0.6rem;
      transition: border-color 0.3s;
    }
    .wait-card:hover { border-color: var(--game-color, var(--gold)); }
    .wait-label {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--game-color, var(--gold));
    }
    .wait-mins {
      font-family: 'Cinzel Decorative', serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1;
    }
    .wait-unit-small { font-size: 0.7rem; color: var(--text-muted); }
    .wait-status {
      font-size: 0.72rem;
      padding: 0.15rem 0.6rem;
      border-radius: 20px;
      border: 1px solid;
    }
    .status-open  { color: #5dbb7a; border-color: #5dbb7a; background: rgba(93,187,122,0.1); }
    .status-busy  { color: var(--gold); border-color: var(--gold); background: rgba(212,175,55,0.1); }
    .status-full  { color: var(--red-bright); border-color: var(--red-bright); background: rgba(231,76,60,0.1); }

    /* ── ランキング ── */
    .ranking-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; margin-bottom: 2rem; }
    @media (max-width: 700px) { .ranking-grid { grid-template-columns: 1fr; } }
    .ranking-card-head {
      display: flex; align-items: center; gap: 0.6rem;
      margin-bottom: 1rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border);
    }
    .ranking-card-icon { font-size: 1.4rem; }
    .ranking-card-title {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      color: var(--game-color, var(--gold));
    }
    .empty-rank { color: var(--text-muted); font-size: 0.8rem; text-align: center; padding: 1rem; }

    /* ── フッター ── */
    .site-footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 1.5rem;
      margin-top: 3rem;
      color: var(--text-muted);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
    }
    .visitor-bar {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .visitor-num {
      font-family: 'Cinzel Decorative', serif;
      font-size: 2rem;
      color: var(--gold);
    }
    .visitor-label { font-size: 0.8rem; color: var(--text-muted); }
  </style>
</head>
<body>

<div class="suit-deco tl">♠</div>
<div class="suit-deco br">♦</div>

<header class="site-header">
  <div class="header-inner">
    <a class="site-logo" href="index.html">♠ Casino Night</a>
    <nav class="site-nav">
      <a class="nav-link active" href="index.html">TOP</a>
      <a class="nav-link" href="ranking.html">Ranking</a>
    </nav>
  </div>
</header>

<div class="container">

  <!-- ヒーロー -->
  <section class="hero">
    <p class="hero-eyebrow">○○高校 文化祭 2025</p>
    <h1 class="hero-title">Casino Night</h1>
    <p class="hero-sub">来てください・遊んでください・勝ってください</p>
    <div class="suits-row">♠ ♥ ♦ ♣</div>
  </section>

  <!-- 来場者数 -->
  <div class="visitor-bar">
    <div>
      <div class="visitor-label">本日の来場者数</div>
      <div class="visitor-num" id="visitor-count">—</div>
    </div>
    <div style="font-size:0.78rem; color:var(--text-muted); text-align:right;">
      最終更新: <span id="last-updated">—</span>
    </div>
  </div>

  <!-- ゲームリンク -->
  <div class="section-head">
    <h2>GAMES</h2><div class="section-line"></div>
  </div>
  <div class="game-links" id="game-links"></div>

  <!-- 待ち時間 -->
  <div class="section-head">
    <h2>WAIT TIME</h2><div class="section-line"></div>
  </div>
  <div class="wait-grid" id="wait-grid"></div>

  <!-- ランキング Top5 -->
  <div class="section-head">
    <h2>RANKING TOP 5</h2><div class="section-line"></div>
    <a href="ranking.html" class="btn btn-outline btn-sm">全て見る →</a>
  </div>
  <div class="ranking-grid" id="ranking-grid"></div>

</div>

<footer class="site-footer">
  ♠ Casino Night &nbsp;|&nbsp; ○○高校 文化祭
</footer>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script>
// ゲームリンク描画
const gameLinksEl = document.getElementById('game-links');
GAMES.forEach(g => {
  gameLinksEl.innerHTML += `
    <a class="game-link-card game-${g.id}" href="ranking.html#${g.id}">
      <span class="game-icon">${g.icon}</span>
      <span class="game-name">${g.label}</span>
    </a>`;
});

// 待ち時間
const waitGridEl = document.getElementById('wait-grid');
function renderWaitGrid(data) {
  waitGridEl.innerHTML = GAMES.map(g => {
    const d = data[g.id] ?? { minutes: 0, status: 'open' };
    const mins = d.minutes ?? 0;
    const statusMap = { open: ['空いてます','status-open'], busy: ['混雑中','status-busy'], full: ['満員','status-full'] };
    const [stLabel, stClass] = statusMap[d.status] ?? statusMap.open;
    return `
      <div class="wait-card game-${g.id}">
        <div class="wait-label">${g.icon} ${g.label}</div>
        <div class="wait-mins">${mins}</div>
        <div class="wait-unit-small">分待ち</div>
        <div class="wait-status ${stClass}">${stLabel}</div>
      </div>`;
  }).join('');
}
renderWaitGrid({});

// 来場者数
db.collection('visitors').doc('total').onSnapshot(snap => {
  const d = snap.data() ?? {};
  document.getElementById('visitor-count').textContent = (d.count ?? 0).toLocaleString() + ' 人';
  document.getElementById('last-updated').textContent = fmtTime(d.updatedAt) || '—';
});

// 待ち時間リアルタイム
db.collection('waitTimes').onSnapshot(snap => {
  const data = {};
  snap.forEach(doc => { data[doc.id] = doc.data(); });
  renderWaitGrid(data);
});

// ランキングTop5
const rankingGridEl = document.getElementById('ranking-grid');
function renderRankingCards(allData) {
  rankingGridEl.innerHTML = GAMES.map(g => {
    const items = (allData[g.id] || []).slice(0, 5);
    const rows = items.length === 0
      ? '<div class="empty-rank">まだデータがありません</div>'
      : items.map((it, i) => `
          <div class="rank-row rank-${i+1}">
            <div class="rank-num ${i < 3 ? '' : 'other'}">${rankDisplay(i+1)}</div>
            <div class="rank-name">${it.name}</div>
            <div class="rank-score">${it.score.toLocaleString()}</div>
          </div>`).join('');
    return `
      <div class="card game-${g.id}">
        <div class="ranking-card-head">
          <span class="ranking-card-icon">${g.icon}</span>
          <span class="ranking-card-title">${g.label}</span>
        </div>
        ${rows}
      </div>`;
  }).join('');
}

// ランキングデータ取得
async function loadRankings() {
  const allData = {};
  await Promise.all(GAMES.map(async g => {
    const snap = await db.collection('rankings')
      .where('gameId', '==', g.id)
      .orderBy('score', 'desc')
      .limit(5)
      .get();
    allData[g.id] = snap.docs.map(d => d.data());
  }));
  renderRankingCards(allData);
}
loadRankings();
// 1分ごとに更新
setInterval(loadRankings, 60000);
</script>
</body>
</html>
