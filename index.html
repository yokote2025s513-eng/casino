<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>不賭死 ♠ 〜君たちは生きて帰れるのか〜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── ヒーローセクション ── */
    .hero {
      text-align: center;
      padding: 5rem 1rem 3.5rem;
      position: relative;
    }
    .hero-ring {
      position: absolute;
      width: 440px; height: 440px;
      border-radius: 50%;
      border: 1px solid rgba(184,0,0,0.12);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .hero-title {
      font-family: 'Noto Serif JP', serif;
      font-weight: 900;
      font-size: clamp(2.8rem, 8vw, 4.2rem);
      color: var(--text);
      letter-spacing: 0.15em;
      text-shadow: 0 0 20px rgba(0,0,0,0.8), 0 0 40px var(--crimson-glow);
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }
    .hero-subtitle {
      font-family: 'Libre Baskerville', serif;
      font-size: clamp(0.75rem, 2.5vw, 0.95rem);
      color: var(--gold);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* ── メインレイアウト ── */
    .main-container {
      width: min(1200px, 94vw);
      margin: 0 auto 5rem;
    }

    /* カウンター表示 */
    .v-counter-box {
      background: linear-gradient(135deg, var(--obsidian-3), var(--obsidian-2));
      border: 1px solid var(--border-gold);
      box-shadow: 0 10px 30px rgba(0,0,0,0.7), inset 0 0 15px rgba(201,168,76,0.05);
      border-radius: 8px;
      padding: 1.8rem;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 3.5rem;
      gap: 1rem;
    }
    .vc-item { text-align: center; flex: 1; }
    .vc-item:not(:last-child) { border-right: 1px solid rgba(201,168,76,0.15); }
    .vc-num {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      font-weight: 700;
      color: var(--gold-light);
      text-shadow: 0 0 10px rgba(240,204,112,0.2);
      margin-bottom: 0.2rem;
    }
    .vc-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
    }

    /* ── 前のリッチなランキンググリッドの復活 ── */
    .section-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.4rem;
      color: var(--gold-light);
      text-align: center;
      margin-bottom: 2rem;
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }
    .section-title::before, .section-title::after {
      content: ''; display: block; width: 40px; height: 1px; background: var(--border-gold);
    }

    .ranking-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    /* リッチなカードデザインの復活 */
    .ranking-card {
      background: linear-gradient(145deg, var(--obsidian-3), var(--obsidian-4));
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 1.25rem;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      transition: transform 0.3s ease, border-color 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .ranking-card::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: transparent;
    }
    /* 各ゲームのテーマカラー上部ライン */
    .ranking-card.game-poker::after { background: #b80000; }
    .ranking-card.game-blackjack::after { background: #2980b9; }
    .ranking-card.game-chinchiro::after { background: #d35400; }
    .ranking-card.game-keiba::after { background: #27ae60; }

    .ranking-card:hover {
      transform: translateY(-4px);
      border-color: rgba(201,168,76,0.25);
    }

    .ranking-card-head {
      display: flex; align-items: center; gap: 0.6rem;
      margin-bottom: 1rem; padding-bottom: 0.6rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .rch-icon { font-size: 1.2rem; }
    .rch-title { font-weight: 700; font-size: 0.95rem; color: var(--text); flex: 1; }
    .rch-count { font-size: 0.7rem; color: var(--text-muted); background: rgba(255,255,255,0.04); padding: 0.15rem 0.4rem; border-radius: 4px; }

    /* ランキング行の装飾 */
    .rank-row {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.55rem 0.4rem; border-radius: 4px;
      margin-bottom: 0.3rem; transition: background 0.2s;
    }
    .rank-row:hover { background: rgba(255,255,255,0.02); }
    .rank-num {
      width: 1.5rem; height: 1.5rem; display: flex; align-items: center; justify-content: center;
      font-family: 'Cinzel', serif; font-size: 0.8rem; font-weight: 700; border-radius: 50%;
    }
    /* 上位3位のメダル風装飾 */
    .rank-1 .rank-num { background: linear-gradient(135deg, #ffd700, #b89700); color: #000; text-shadow: none; box-shadow: 0 2px 6px rgba(255,215,0,0.3); }
    .rank-2 .rank-num { background: linear-gradient(135deg, #cccccc, #888888); color: #000; text-shadow: none; }
    .rank-3 .rank-num { background: linear-gradient(135deg, #cd7f32, #8a4500); color: #000; text-shadow: none; }
    .rank-num.other { color: var(--text-muted); background: rgba(255,255,255,0.05); }

    .rank-name { flex: 1; font-size: 0.85rem; color: var(--text-warm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-score { font-family: 'Cinzel', serif; font-size: 0.9rem; font-weight: 600; color: var(--gold); text-align: right; }

    .empty-rank { text-align: center; color: var(--text-muted); font-size: 0.78rem; padding: 2rem 0; }

    /* ナビゲーションリンク */
    .nav-links-wrap {
      display: flex; justify-content: center; gap: 1rem; margin-top: 3rem;
    }
    .nav-btn-main {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      background: var(--obsidian-3); border: 1px solid var(--border-red);
      color: var(--text); padding: 0.8rem 1.6rem; border-radius: 6px;
      font-size: 0.9rem; font-weight: 500; text-decoration: none;
      transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .nav-btn-main:hover {
      background: var(--crimson); border-color: var(--crimson-hot);
      box-shadow: 0 4px 20px var(--crimson-glow); transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="hero-ring"></div>
    <h1 class="hero-title">不賭死</h1>
    <div class="hero-subtitle">♠ Casino Night ♠</div>
  </div>

  <div class="main-container">
    <div class="v-counter-box">
      <div class="vc-item">
        <div id="visitor-count" class="vc-num">—</div>
        <div class="vc-label">TOTAL VISITORS</div>
      </div>
      <div class="vc-item">
        <div id="last-updated" class="vc-num">—</div>
        <div class="vc-label">LAST UPDATED</div>
      </div>
    </div>

    <h2 class="section-title">LEADERBOARD</h2>
    
    <div id="ranking-grid" class="ranking-grid">
      <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 3rem 0;">
        ランキングデータを読み込み中...
      </div>
    </div>

    <div class="nav-links-wrap">
      <a href="self-reserve.html" class="nav-btn-main">🎟 自座予約 (受付)</a>
      <a href="ranking.html" class="nav-btn-main">🏆 全順位を見る</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>
  <script src="common.js"></script>
  <script>
    // 🔥 Firebaseリクエスト節約のため、onSnapshotではなく一度だけ安全に get() する設計を継承

    async function initializePage() {
      try {
        // 1. 来場者カウンターの取得
        const visSnap = await visitorCol().doc('total').get();
        if (visSnap.exists) {
          const d = visSnap.data();
          document.getElementById('visitor-count').textContent = (d.count ?? 0).toLocaleString() + ' 人';
          document.getElementById('last-updated').textContent = fmtTime(d.updatedAt) || '—';
        } else {
          document.getElementById('visitor-count').textContent = '0 人';
          document.getElementById('last-updated').textContent = '—';
        }

        // 2. 全ゲームのランキングデータを一括取得してメモリ内で振り分け（リクエスト数=1回にする最強の節約術）
        const rankSnap = await rankingCol().orderBy('score', 'desc').get();
        const allData = {};
        GAMES.forEach(g => { allData[g.id] = []; });
        
        rankSnap.forEach(doc => {
          const data = doc.data();
          if (allData[data.gameId]) {
            allData[data.gameId].push(data);
          }
        });

        // 3. UIのレンダリング（前の格好良いデザインを適用）
        const rankingGridEl = document.getElementById('ranking-grid');
        
        rankingGridEl.innerHTML = GAMES.map(g => {
          const items = allData[g.id].slice(0, 5); // 各ゲーム上位5名
          const rows = items.length === 0
            ? '<div class="empty-rank">— まだデータがありません —</div>'
            : items.map((it, i) => `
                <div class="rank-row rank-${i + 1}">
                  <div class="rank-num ${i < 3 ? '' : 'other'}">${i < 3 ? '' : (i + 1)}</div>
                  <div class="rank-name">${it.name || '—'}</div>
                  <div class="rank-score">${it.score.toLocaleString()}</div>
                </div>`).join('');

          return `
            <div class="ranking-card game-${g.id}">
              <div class="ranking-card-head">
                <span class="rch-icon">${g.icon}</span>
                <span class="rch-title">${g.label}</span>
                <span class="rch-count">${allData[g.id].length}人参加</span>
              </div>
              <div class="ranking-rows-wrap">
                ${rows}
              </div>
            </div>`;
        }).join('');

      } catch (e) {
        console.error(e);
        document.getElementById('ranking-grid').innerHTML = 
          `<div style="grid-column:1/-1; text-align:center; color:var(--red-bright); font-size:0.85rem; padding:2rem;">データの読み込みに失敗しました: ${e.message}</div>`;
      }
    }

    window.addEventListener('DOMContentLoaded', initializePage);
  </script>
</body>
</html>
