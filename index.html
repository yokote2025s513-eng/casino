<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>不賭死 ♠ 〜君たちは生きて帰れるのか〜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── ヒーロー ── */
    .hero {
      text-align: center;
      padding: 4.5rem 1rem 3rem;
      position: relative;
    }

    /* カジノチップ風の装飾リング */
    .hero-ring {
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      border: 1px solid rgba(184,0,0,0.08);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .hero-ring:nth-child(2) { width:500px; height:500px; border-color:rgba(201,168,76,0.04); }
    .hero-ring:nth-child(3) { width:600px; height:600px; border-color:rgba(184,0,0,0.04); }

    .hero-eyebrow {
      font-size: 0.7rem; letter-spacing: 0.4em;
      color: var(--text-muted); margin-bottom: 1.5rem;
      text-transform: uppercase;
      position: relative;
      display: inline-flex; align-items: center; gap: 1rem;
    }
    .hero-eyebrow::before, .hero-eyebrow::after {
      content: '—'; opacity: 0.4;
    }

    .hero-kanji {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(4rem, 15vw, 9rem);
      font-weight: 900;
      color: var(--crimson-hot);
      display: block;
      line-height: 0.9;
      letter-spacing: -0.02em;
      margin-bottom: 0.3rem;
      text-shadow:
        0 0 40px rgba(184,0,0,0.9),
        0 0 80px rgba(184,0,0,0.5),
        0 0 160px rgba(184,0,0,0.2),
        3px 3px 0 rgba(0,0,0,1),
        6px 6px 0 rgba(80,0,0,0.5);
      position: relative;
    }

    .hero-en {
      font-family: 'Libre Baskerville', serif;
      font-size: clamp(0.65rem, 1.5vw, 0.85rem);
      letter-spacing: 0.5em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 0.8rem;
      opacity: 0.8;
    }

    .hero-tagline {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(0.72rem, 1.8vw, 0.88rem);
      color: var(--text-muted);
      letter-spacing: 0.2em;
      margin-bottom: 2rem;
    }

    /* カードスーツ装飾 */
    .suits {
      display: flex; justify-content: center; align-items: center;
      gap: 0.6rem; font-size: 1.1rem; opacity: 0.35;
    }
    .suits span { color: var(--crimson-hot); }
    .suits span.black { color: var(--text-warm); }
    .suits-divider { width: 1px; height: 12px; background: var(--border-red); }

    /* ── 来場者バー ── */
    .visitor-bar {
      background: linear-gradient(135deg, var(--obsidian-3), var(--obsidian-4));
      border: 1px solid var(--border-red);
      border-radius: 6px;
      padding: 1.4rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 2.5rem; flex-wrap: wrap; gap: 1rem;
      box-shadow: var(--shadow-card), inset 0 0 40px rgba(184,0,0,0.04);
      position: relative; overflow: hidden;
    }
    /* 右上の装飾 */
    .visitor-bar::after {
      content: '♠';
      position: absolute; right: 1.5rem; top: 50%;
      transform: translateY(-50%);
      font-size: 4rem; opacity: 0.04; color: var(--crimson-hot);
      pointer-events: none;
    }
    .visitor-num {
      font-family: 'Libre Baskerville', serif;
      font-size: 2.8rem; font-weight: 700;
      color: var(--crimson-hot);
      text-shadow: 0 0 30px rgba(184,0,0,0.6);
      line-height: 1;
    }
    .visitor-label {
      font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.25em; color: var(--text-muted);
      margin-bottom: 0.3rem; text-transform: uppercase;
    }

    /* ── ランキング ── */
    .ranking-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:1.5rem; margin-bottom:2rem; }
    @media(max-width:700px) { .ranking-grid { grid-template-columns:1fr; } }

    .ranking-card {
      background: var(--obsidian-3);
      border: 1px solid var(--border-dim);
      border-radius: 6px; padding: 1.5rem;
      box-shadow: var(--shadow-card);
      position: relative; overflow: hidden;
      transition: border-color 0.3s;
    }
    .ranking-card::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.02) 0%, transparent 40%);
      pointer-events: none;
    }
    .ranking-card::after {
      content: ''; position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.2), transparent);
    }
    .ranking-card:hover { border-color: var(--border-red); }

    .ranking-card-head {
      display: flex; align-items: center; gap: 0.7rem;
      margin-bottom: 1rem; padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border-dim);
    }
    .rch-icon { font-size: 1.2rem; }
    .rch-title {
      font-size: 0.88rem; font-weight: 700;
      color: var(--game-color, var(--crimson-hot));
      letter-spacing: 0.06em;
    }
    .rch-count {
      margin-left: auto; font-size: 0.68rem;
      color: var(--text-muted); letter-spacing: 0.1em;
    }
    .empty-rank {
      color: var(--text-muted); font-size: 0.8rem;
      text-align: center; padding: 1.5rem;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

<div class="suit-deco tl">♠</div>
<div class="suit-deco br">♥</div>
<div class="suit-deco center">♦</div>
<div class="suit-deco float1">♣</div>
<div class="suit-deco float2">♠</div>

<header class="site-header">
  <div class="header-inner">
    <a class="site-logo" href="index.html">不賭死</a>
    <nav class="site-nav">
      <a class="nav-link active" href="index.html">TOP</a>
      <a class="nav-link" href="ranking.html">ランキング</a>
    </nav>
  </div>
</header>

<div class="container">

  <!-- ヒーロー -->
  <section class="hero">
    <div class="hero-ring"></div>
    <div class="hero-ring"></div>
    <div class="hero-ring"></div>

    <p class="hero-eyebrow">美入野祭 2026</p>
    <span class="hero-kanji">不賭死</span>
    <p class="hero-tagline">〜君たちは生きて帰れるのか〜</p>

    <div class="suits">
      <span>♠</span>
      <div class="suits-divider"></div>
      <span>♥</span>
      <div class="suits-divider"></div>
      <span class="black">♣</span>
      <div class="suits-divider"></div>
      <span>♦</span>
    </div>
  </section>

  <!-- 来場者数 -->
  <div class="visitor-bar">
    <div>
      <div class="visitor-label">本日の来場者</div>
      <div class="visitor-num" id="visitor-count">—</div>
    </div>
    <div style="text-align:right;">
      <div class="visitor-label">最終更新</div>
      <div style="font-size:0.85rem;color:var(--text-warm);font-family:'Libre Baskerville',serif;" id="last-updated">—</div>
    </div>
  </div>

  <!-- 総合ランキング Top5 -->
  <div class="section-head">
    <h2>🏆 総合 TOP 5</h2>
    <div class="section-line"></div>
    <a href="ranking.html" class="btn btn-outline btn-sm">全て見る →</a>
  </div>
  <div class="ranking-card" id="all-ranking-card" style="margin-bottom:2rem;"></div>

</div>

<footer class="site-footer">
  不賭死 &ensp;·&ensp; 〜君たちは生きて帰れるのか〜
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script>
const SUIT_MAP = { poker:'♠', blackjack:'♥', chinchiro:'🎲', keiba:'♦' };

// 来場者数
db.collection('visitors').doc('total').onSnapshot(snap => {
  const d=snap.data()??{};
  document.getElementById('visitor-count').textContent=(d.count??0).toLocaleString()+' 人';
  document.getElementById('last-updated').textContent=fmtTime(d.updatedAt)||'—';
});

// ランキング（リアルタイム）
const allRankingEl = document.getElementById('all-ranking-card');
const medals = ['🥇','🥈','🥉','4','5'];
let allDocs = [];

db.collection('rankings').orderBy('score','desc').onSnapshot(snap => {
  allDocs = snap.docs.map(d => d.data());
  renderAllCard();
});

// 総合カード（合計賞金 TOP5）
function renderAllCard() {
  const items = [...allDocs].sort((a,b) => (b.score??0) - (a.score??0)).slice(0, 5);
  const rows = items.length === 0
    ? '<div class="empty-rank">— まだデータがありません —</div>'
    : items.map((it, i) => `
        <div class="rank-row rank-${i+1}">
          <div class="rank-num ${i<3?'':'other'}">${medals[i]}</div>
          <div class="rank-name">${it.name}</div>
          <div class="rank-score">${(it.score??0).toLocaleString()}</div>
        </div>`).join('');
  allRankingEl.innerHTML = `
    <div class="ranking-card-head">
      <span class="rch-icon">🏆</span>
      <span class="rch-title" style="color:var(--gold)">総合ランキング</span>
      <span class="rch-count">${allDocs.length}人参加</span>
    </div>
    ${rows}`;
}
</script>
</body>
</html>
