<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>不賭死 ♠ 〜君たちは生きて帰れるのか〜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── ヒーロー ── */
    .hero {
      text-align: center;
      padding: 4.5rem 1rem 3rem;
      position: relative;
    }
    .hero-ring {
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      border: 1px solid rgba(184,0,0,0.08);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }
    .hero-inner { position: relative; z-index: 1; }
    .hero-logo { font-size: 3.5rem; margin-bottom: 0.5rem; filter: drop-shadow(0 0 15px rgba(184,0,0,0.4)); }
    .hero-title {
      font-family: 'Noto Serif JP', serif;
      font-weight: 900;
      font-size: 2.4rem;
      letter-spacing: 0.15em;
      background: linear-gradient(180deg, var(--text) 0%, var(--gold-pale) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
    }
    .hero-sub {
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      letter-spacing: 0.35em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    .hero-lead {
      font-size: 0.9rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      font-family: 'Libre Baskerville', serif;
      font-style: italic;
    }

    /* ── メインレイアウト ── */
    .main-layout {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 1.5rem 5rem;
    }

    /* ── ナビゲーション ── */
    .nav-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 3rem;
    }
    .nav-card {
      background: var(--obsidian-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.5rem;
      text-align: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      overflow: hidden;
    }
    .nav-card::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(184,0,0,0.05) 0%, transparent 100%);
      opacity: 0; transition: opacity 0.3s ease;
    }
    .nav-card:hover {
      border-color: var(--border-red);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.5), var(--shadow-red-dim);
    }
    .nav-card:hover::before { opacity: 1; }
    .nav-icon { font-size: 1.8rem; display: block; margin-bottom: 0.4rem; }
    .nav-title { font-family: 'Noto Serif JP', serif; font-weight: 700; font-size: 1.05rem; color: var(--gold-light); margin-bottom: 0.2rem; }
    .nav-desc { font-size: 0.78rem; color: var(--text-muted); }

    /* ── ステータス ── */
    .status-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
      margin-bottom: 3.5rem;
    }
    @media (max-width: 768px) {
      .status-grid { grid-template-columns: 1fr; }
    }

    .status-card {
      background: var(--obsidian-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.8rem;
    }
    .card-title-area {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.8rem; margin-bottom: 1.2rem;
    }
    .card-title { font-family: 'Cinzel', 'Noto Serif JP', serif; font-size: 0.95rem; font-weight: 700; color: var(--gold); letter-spacing: 0.08em; }
    .card-side-info { font-size: 0.72rem; color: var(--text-muted); }

    /* 待ち時間リスト */
    .wait-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .wait-item {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--obsidian-3); padding: 0.75rem 1.2rem; border-radius: 4px;
      border-left: 3px solid var(--crimson);
    }
    .wait-game { display: flex; align-items: center; gap: 0.6rem; font-size: 0.92rem; font-weight: 500; }
    .wait-game-icon { color: var(--gold-light); font-size: 1.1rem; }
    .wait-time-value { font-family: 'Cinzel', serif; font-weight: 700; font-size: 1.15rem; color: var(--text); }
    .wait-time-value span { font-size: 0.75rem; color: var(--text-muted); margin-left: 2px; font-weight: 400; }

    /* カウンター */
    .counter-block { text-align: center; padding: 1rem 0; }
    .counter-num { font-family: 'Cinzel', serif; font-size: 2.8rem; font-weight: 700; color: var(--gold-light); text-shadow: 0 0 20px var(--gold-dim); line-height: 1.2; }
    .counter-unit { font-size: 0.9rem; color: var(--text-muted); margin-left: 4px; font-family: 'Noto Sans JP', sans-serif; }

    /* ── ランキングセクション ── */
    .section-head { margin-bottom: 1.5rem; text-align: center; }
    .section-title { font-family: 'Cinzel', 'Noto Serif JP', serif; font-size: 1.2rem; font-weight: 700; color: var(--gold-light); letter-spacing: 0.15em; }
    
    .ranking-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 850px) {
      .ranking-grid { grid-template-columns: 1fr; }
    }

    /* アップロードされた元ファイルそのままのランキング構造 */
    .ranking-card {
      background: var(--obsidian-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.5rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .ranking-card-head {
      display: flex; align-items: center; gap: 0.6rem;
      padding-bottom: 0.6rem; border-bottom: 1px solid var(--border-gold-dim);
      margin-bottom: 1rem;
    }
    .rch-icon { font-size: 1.4rem; color: var(--gold-light); }
    .rch-title { font-family: 'Noto Serif JP', serif; font-weight: 700; font-size: 1.1rem; color: var(--gold-light); }
    .rch-count { margin-left: auto; font-size: 0.75rem; color: var(--text-muted); font-family: 'Cinzel', serif; }

    .rank-row {
      display: flex; align-items: center; gap: 0.8rem;
      padding: 0.55rem 0; border-bottom: 1px solid rgba(212,175,55,0.05);
    }
    .rank-row:last-child { border-bottom: none; }
    .rank-num { font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: 700; width: 1.8rem; text-align: center; }
    .rank-1 .rank-num { color: #ffd700; }
    .rank-2 .rank-num { color: #cccccc; }
    .rank-3 .rank-num { color: #cd7f32; }
    .rank-row.other-rank .rank-num { color: var(--text-muted); font-size: 0.9rem; }
    
    .rank-name { font-size: 0.92rem; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-score { font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: 600; color: var(--gold-pale); text-align: right; }
    
    .empty-rank { text-align: center; color: var(--text-muted); font-size: 0.82rem; padding: 1.5rem 0; font-style: italic; }
  </style>
</head>
<body>

  <div class="hero">
    <div class="hero-ring"></div>
    <div class="hero-inner">
      <div class="hero-logo">♠</div>
      <h1 class="hero-title">不賭死</h1>
      <div class="hero-sub">Casino Night</div>
      <p class="hero-lead">〜君たちは生きて帰れるのか〜</p>
    </div>
  </div>

  <div class="main-layout">
    
    <div class="nav-grid">
      <a href="self-reserve.html" class="nav-card">
        <span class="nav-icon">🃏</span>
        <span class="nav-title">ゲーム参加予約</span>
        <span class="nav-desc">スマホから現在のディーラー卓へ予約エントリー</span>
      </a>
      <a href="ranking.html" class="nav-card">
        <span class="nav-icon">🏆</span>
        <span class="nav-title">総合ランキング</span>
        <span class="nav-desc">全プレイヤーの全記録・スコア検索はこちら</span>
      </a>
    </div>

    <div class="status-grid">
      <div class="status-card">
        <div class="card-title-area">
          <span class="card-title">▸ CURRENT WAIT TIMES</span>
          <span class="card-side-info" id="wait-updated">目安時間</span>
        </div>
        <div class="wait-list" id="wait-list-container">
          </div>
      </div>

      <div class="status-card">
        <div class="card-title-area">
          <span class="card-title">▸ VISITORS</span>
        </div>
        <div class="counter-block">
          <div class="counter-num" id="visitor-count">0<span class="counter-unit">人</span></div>
        </div>
      </div>
    </div>

    <div class="section-head">
      <h2 class="section-title">♦ LEADERBOARD (TOP 5) ♦</h2>
    </div>

    <div class="ranking-grid" id="ranking-grid">
      </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>
  <script src="common.js"></script>
  <script>
    // 1. 来場者数カウンター監視
    db.collection('visitors').doc('total').onSnapshot(doc => {
      const d = doc.data() || { count: 0 };
      document.getElementById('visitor-count').innerHTML = `${(d.count ?? 0).toLocaleString()}<span class="counter-unit">人</span>`;
    });

    // 2. 待ち時間情報監視
    db.collection('waitTimes').onSnapshot(snap => {
      const data = {};
      snap.docs.forEach(d => { data[d.id] = d.data(); });
      
      const container = document.getElementById('wait-list-container');
      container.innerHTML = GAMES.map(g => {
        const mins = data[g.id]?.minutes ?? 0;
        let displayTime = `${mins}<span>分</span>`;
        if (mins === 0) displayTime = `<span style="color:var(--gold-light)">即案内</span>`;
        if (mins < 0) displayTime = `<span style="color:var(--text-muted)">受付終了</span>`;

        return `
          <div class="wait-item">
            <div class="wait-game">
              <span class="wait-game-icon">${g.icon}</span>
              <span>${g.label}</span>
            </div>
            <div class="wait-time-value">${displayTime}</div>
          </div>
        `;
      }).join('');
      document.getElementById('wait-updated').textContent = 'リアルタイム更新中';
    });

    // 3. ランキングボード完全リアルタイム同期監視 (独立4並列処理)
    const cachedRankings = {};
    const medals = ['🥇', '🥈', '🥉', '4', '5'];

    GAMES.forEach(g => {
      db.collection('rankings')
        .where('gameId', '==', g.id)
        .orderBy('score', 'desc')
        .onSnapshot(snap => {
          cachedRankings[g.id] = snap.docs.map(d => d.data());
          refreshRankingDOM();
        });
    });

      gridEl.innerHTML = GAMES.map(g => {

        const top5 = allItems.slice(
