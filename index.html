<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>不死賭 ♠ 〜君たちは生きて帰れるのか〜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── ヒーロー ── */
    .hero {
      text-align: center;
      padding: 4.5rem 1rem 3rem;
      position: relative;
    }

    /* カジノチップ風の装飾リング */
    .hero-ring {
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      border: 1px solid rgba(184,0,0,0.08);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .hero-logo-sub {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.4em;
      color: var(--gold);
      margin-bottom: 0.7rem;
      opacity: 0.8;
    }
    .hero-logo-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--text);
      letter-spacing: 0.05em;
      text-shadow: 0 0 40px var(--crimson-glow);
      margin-bottom: 0.5rem;
      line-height: 1.1;
    }
    .hero-tagline {
      font-family: 'Noto Serif JP', serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      color: var(--gold-pale);
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* セクションヘッド */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 3rem;
      margin-bottom: 1.5rem;
    }
    .section-head h2 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--gold-light);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .section-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, rgba(201,168,76,0.3), transparent);
      margin-left: 1.5rem;
      margin-right: 1.5rem;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="hero">
    <div class="hero-ring"></div>
    <div class="hero-logo-sub">CASINO EVENT SYSTEM</div>
    <h1 class="hero-logo-title">不賭死</h1>
    <p class="hero-tagline">〜君たちは生きて帰れるのか〜</p>
  </div>

  <div class="section-head">
    <h2>ランキング TOP 5</h2>
    <div class="section-line"></div>
    <a href="ranking.html" class="btn btn-outline btn-sm">全て見る →</a>
  </div>
  <div class="ranking-grid" id="ranking-grid"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>

<script>
  const rankingGridEl = document.getElementById('ranking-grid');
  const medals = ['🥇', '🥈', '🥉', '4', '5'];

  function renderRankingCards(allData) {
    rankingGridEl.innerHTML = GAMES.map(g => {
      const items = (allData[g.id] || []).slice(0, 5);
      const rows = items.length === 0
        ? '<div class="empty-rank">— まだデータがありません —</div>'
        : items.map((it, i) => `
            <div class="rank-row rank-${i+1}">
              <div class="rank-num ${i < 3 ? '' : 'other'}">${medals[i]}</div>
              <div class="rank-name">${it.name}</div>
              <div class="rank-score">${it.score.toLocaleString()}</div>
            </div>`).join('');

      return `
        <div class="ranking-card game-${g.id}">
          <div class="ranking-card-head">
            <span class="rch-icon">${g.icon}</span>
            <span class="rch-title">${g.label}</span>
            <span class="rch-count">${(allData[g.id] || []).length}人参加</span>
          </div>
          ${rows}
        </div>`;
    }).join('');
  }

  function startRankingListener() {
    db.collection('rankings')
      .orderBy('score', 'desc')
      .onSnapshot(snap => {
        const allData = {};
        GAMES.forEach(g => allData[g.id] = []);
        
        snap.docs.forEach(doc => {
          const d = doc.data();
          if (allData[d.gameId]) {
            allData[d.gameId].push(d);
          }
        });
        renderRankingCards(allData);
      }, err => {
        console.error("Firestore Error:", err);
      });
  }

  document.addEventListener('DOMContentLoaded', () => {
    startRankingListener();
  });
</script>
</body>
</html>
