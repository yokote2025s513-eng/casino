<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>不賭死 ♠ 〜君たちは生きて帰れるのか〜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── ヒーロー ── */
    .hero {
      text-align: center; padding: 4.5rem 1rem 3rem; position: relative;
    }
    .hero-ring {
      position: absolute; width: 400px; height: 400px; border-radius: 50%;
      border: 1px solid rgba(184,0,0,0.08); top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none;
    }
    .hero-icon { font-size: 2.2rem; color: var(--crimson-hot); margin-bottom: 0.5rem; display: block; animation: pulse 3s infinite; }
    @keyframes pulse { 0%, 100% { opacity:0.8; transform:scale(1); } 50% { opacity:0.3; transform:scale(0.95); } }
    
    .hero-title {
      font-family: 'Noto Serif JP', serif; font-weight: 900; font-size: min(3rem, 10vw);
      letter-spacing: 0.15em; color: var(--text); text-shadow: 0 4px 20px rgba(0,0,0,0.8);
      line-height: 1.2; margin-bottom: 0.8rem;
    }
    .hero-title span { color: var(--crimson-hot); }
    .hero-subtitle {
      font-family: 'Libre Baskerville', serif; font-size: min(0.95rem, 3.8vw);
      letter-spacing: 0.3em; color: var(--gold-light); text-transform: uppercase; margin-bottom: 2.5rem;
    }
    
    /* ── ステータスサマリー ── */
    .status-summary {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 3rem;
    }
    .status-card {
      background: linear-gradient(180deg, var(--obsidian-3) 0%, var(--obsidian-2) 100%);
      border: 1px solid var(--border-gold); border-radius: 6px; padding: 1.2rem; text-align: center;
    }
    .sc-val { font-family: 'Cinzel', serif; font-size: 1.8rem; font-weight: 700; color: var(--gold-light); margin-top: 0.2rem; }
    .sc-lbl { font-size: 0.72rem; color: var(--text-muted); font-weight: 700; letter-spacing: 0.05em; }

    /* ── アクションエリア ── */
    .action-zone { text-align: center; margin-bottom: 4rem; }
    .action-zone .btn { width: min(320px, 85vw); padding: 1rem; font-size: 1.05rem; }

    /* ── ランキングセクション ── */
    .sec-title {
      font-family: 'Noto Serif JP', serif; font-weight: 700; font-size: 1.3rem;
      text-align: center; margin-bottom: 2rem; color: var(--text-warm); letter-spacing: 0.1em;
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
    }
    .sec-title::before, .sec-title::after { content: ''; width: 40px; height: 1px; background: var(--border-gold); }
    
    .ranking-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; margin-bottom: 5rem;
    }
    .ranking-card {
      background: var(--obsidian-2); border: 1px solid var(--border-red); border-radius: 6px;
      padding: 1.2rem; box-shadow: var(--shadow-red); transition: transform 0.2s;
    }
    .ranking-card:hover { transform: translateY(-3px); }
    .ranking-card-head {
      display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;
      border-bottom: 1px solid rgba(212,175,55,0.1); padding-bottom: 0.6rem;
    }
    .rch-icon { font-size: 1.1rem; }
    .rch-title { font-weight: 700; font-size: 0.95rem; color: var(--gold-light); flex: 1; }
    .rch-count { font-size: 0.72rem; color: var(--text-muted); font-family: 'Cinzel', serif; }

    .rank-row {
      display: flex; align-items: center; gap: 0.8rem; padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.88rem;
    }
    .rank-row:last-child { border-bottom: none; }
    .rank-num { font-family: 'Cinzel', serif; font-weight: 700; width: 1.5rem; text-align: center; }
    .rank-1 .rank-num { color: #ffd700; }
    .rank-2 .rank-num { color: #cccccc; }
    .rank-3 .rank-num { color: #cd7f32; }
    .rank-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-warm); }
    .rank-score { font-family: 'Cinzel', serif; font-weight: 600; color: var(--gold-pale); text-align: right; }
    .empty-rank { text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 2rem 0; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <div class="header-logo">不賭死<span>♠</span></div>
      <nav class="header-nav">
        <a href="index.html" style="color:var(--gold-light)">TOP</a>
        <a href="ranking.html">検索</a>
        <a href="self-reserve.html">順番待ち予約</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-ring"></div>
      <i class="hero-icon">♠</i>
      <h1 class="hero-title">不賭死</h1>
      <p class="hero-subtitle">〜君たちは生きて帰れるのか〜</p>
    </section>

    <section class="action-zone">
      <button onclick="location.href='self-reserve.html'" class="btn btn-primary">
        <span>♣ 順番待ち予約をする</span>
      </button>
    </section>

    <section class="status-summary">
      <div class="status-card">
        <div class="sc-lbl">TOTAL VISITORS</div>
        <div class="sc-val" id="visitor-count">—</div>
      </div>
      <div class="status-card">
        <div class="sc-lbl">LAST UPDATE</div>
        <div class="sc-val" id="last-updated" style="font-size:1.1rem; margin-top:0.6rem;">—</div>
      </div>
    </section>

    <section>
      <h2 class="sec-title">LEADERBOARD TOP 5</h2>
      <div class="ranking-grid" id="ranking-grid">
        </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="common.js"></script>
  <script>
    // リアルタイム来場者
    visitorCol().doc('total').onSnapshot(doc => {
      const d = doc.data() || { count: 0 };
      document.getElementById('visitor-count').textContent = (d.count ?? 0).toLocaleString() + ' 人';
      document.getElementById('last-updated').textContent = fmtTime(d.updatedAt) || '—';
    });

    // ランキング生成
    const rankingGridEl = document.getElementById('ranking-grid');
    const medals = ['🥇','🥈','🥉','4','5'];

    function renderRankingCards(allData) {
      rankingGridEl.innerHTML = GAMES.map(g => {
        const items = (allData[g.id] || []).slice(0, 5);
        const rows = items.length === 0
          ? '<div class=\"empty-rank\">— まだデータがありません —</div>'
          : items.map((it, i) => `
              <div class="rank-row rank-${i+1}">
                <div class="rank-num">${medals[i]}</div>
                <div class="rank-name">${it.name}</div>
                <div class="rank-score">${it.score.toLocaleString()}</div>
              </div>`).join('');
        return `
          <div class="ranking-card">
            <div class="ranking-card-head">
              <span class="rch-icon">${g.icon}</span>
              <span class="rch-title">${g.label}</span>
              <span class="rch-count">${(allData[g.id]||[]).length}人</span>
            </div>
            ${rows}
          </div>`;
      }).join('');
    }

    async function loadRankings() {
      const allData = {};
      await Promise.all(GAMES.map(async g => {
        const snap = await rankingCol().where('gameId', '==', g.id).orderBy('score', 'desc').limit(5).get();
        allData[g.id] = snap.docs.map(d => d.data());
      }));
      renderRankingCards(allData);
    }

    // 初回ロード
    loadRankings();
    // 30秒ごとに簡易更新
    setInterval(loadRankings, 30000);
  </script>
</body>
</html>
