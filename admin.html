<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Admin Login ♠ 不賭死</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; }
    .login-wrap { width:min(420px, 92vw); animation:fadeUp 0.4s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }
    .login-logo { text-align:center; margin-bottom:2rem; }
    .login-logo-icon { font-size:3rem; display:block; margin-bottom:0.5rem; text-shadow:0 0 30px rgba(212,175,55,0.3); }
    .login-logo-text { font-family:'Cinzel Decorative', serif; font-size:1.4rem; color:var(--gold); letter-spacing:0.06em; }
    .dest-selector { display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; margin-bottom:1.5rem; }
    .dest-btn {
      background: var(--obsidian-3); border:1px solid var(--border); border-radius:4px;
      padding:0.75rem; color:var(--text-muted); font-size:0.82rem; cursor:pointer; transition:all 0.2s;
      text-align:center; font-family:'Noto Sans JP', sans-serif;
    }
    .dest-btn:hover { border-color:var(--gold); color:var(--text); }
    .dest-btn.selected { background:var(--gold-dim); border-color:var(--gold); color:var(--gold-light); font-weight:500; box-shadow:0 0 15px rgba(201,168,76,0.1); }
    .dest-btn-icon { display:block; font-size:1.1rem; margin-bottom:0.2rem; }
    .form-group input { text-align:center; letter-spacing:0.05em; }
    #err-msg { color:var(--red-bright); font-size:0.8rem; text-align:center; margin-top:0.8rem; min-height:1.2rem; }
  </style>
</head>
<body>

  <div class="login-wrap">
    <div class="login-logo">
      <span class="login-logo-icon">♠</span>
      <span class="login-logo-text">CASINO NIGHT</span>
    </div>

    <div class="card" style="padding:2rem;">
      <div style="font-size:0.75rem; color:var(--text-muted); font-family:'Cinzel',serif; letter-spacing:0.1em; text-align:center; margin-bottom:1rem;">SELECT DESTINATION</div>
      
      <div class="dest-selector">
        <button class="dest-btn selected" data-dest="admin-reserve.html" onclick="selectDest(this)">
          <span class="dest-btn-icon">🎟</span>受付・待機列管理
        </button>
        <button class="dest-btn" data-dest="admin-ranking.html" onclick="selectDest(this)">
          <span class="dest-btn-icon">🏆</span>スコア・順位入力
        </button>
      </div>

      <div class="form-group">
        <label>EMAIL ADDRESS</label>
        <input type="email" id="email-input" placeholder="staff@example.com" onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <div class="form-group" style="margin-bottom:1.5rem;">
        <label>PASSWORD</label>
        <input type="password" id="pw-input" placeholder="••••••••" onkeydown="if(event.key==='Enter') doLogin()">
      </div>

      <button id="login-btn" class="btn btn-gold" style="width:100%; letter-spacing:0.1em;" onclick="doLogin()">ENTER ▶</button>
      <div id="err-msg"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <script src="firebase-config.js"></script>
  <script src="common.js"></script>
  <script src="auth.js"></script> <script>
    const STORAGE_KEY = 'casino_admin_auth';
    let selectedDest = 'admin-reserve.html';

    // ページ読み込み時にログイン済みかチェック
    window.addEventListener('DOMContentLoaded', () => {
      firebase.auth().onAuthStateChanged((user) => {
        if (user) {
          // 既にログインしている場合はセッションをセットして自動遷移
          sessionStorage.setItem(STORAGE_KEY, 'ok');
          location.replace(selectedDest);
        }
      });
    });

    function selectDest(btn) {
      document.querySelectorAll('.dest-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedDest = btn.dataset.dest;
    }

    async function doLogin() {
      const email = document.getElementById('email-input').value.trim();
      const pw    = document.getElementById('pw-input').value;
      const errEl = document.getElementById('err-msg');
      const btn   = document.getElementById('login-btn');

      if (!email || !pw) {
        errEl.textContent = 'メールアドレスとパスワードを入力してください';
        return;
      }

      if (btn.disabled) return; // 二重クリック防止

      btn.disabled = true;
      btn.textContent = 'ログイン中...';
      errEl.textContent = '';

      try {
        // 選択された遷移先に応じて必要な権限を判断
        const requiredRole = (selectedDest === 'super-admin.html') ? 'super' : 'staff';
        
        // auth.js の共通認証関数を呼び出す
        await signInWithRole(email, pw, requiredRole);

        sessionStorage.setItem(STORAGE_KEY, 'ok');
        
        btn.textContent = '✓ ログイン成功';
        setTimeout(() => location.replace(selectedDest), 400);

      } catch(e) {
        console.error(e);
        let msg = 'ログインに失敗しました';
        if (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found') {
          msg = 'メールアドレスまたはパスワードが違います';
        } else if (e.message) {
          msg = e.message;
        }
        errEl.textContent = msg;
        
        // パスワード入力欄をガタガタ揺らす演出
        const pwInput = document.getElementById('pw-input');
        pwInput.classList.add('error');
        setTimeout(() => pwInput.classList.remove('error'), 400);
        
        btn.disabled = false;
        btn.textContent = 'ENTER ▶';
      }
    }
  </script>
</body>
</html>
