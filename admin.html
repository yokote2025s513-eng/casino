<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Admin Login ♠ 不賭死</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; }

    .login-wrap { width:min(440px, 92vw); animation:fadeUp 0.4s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }

    .login-logo { text-align:center; margin-bottom:2rem; }
    .login-logo-title {
      font-family:'Cinzel Decorative',serif; font-size:2rem;
      color:var(--gold); letter-spacing:0.1em;
      text-shadow:0 0 30px rgba(201,168,76,0.5);
    }
    .login-logo-sub {
      font-family:'Cinzel',serif; font-size:0.68rem;
      letter-spacing:0.35em; color:var(--text-muted); margin-top:0.4rem;
    }

    .login-card {
      background:var(--bg-card); border:1px solid var(--border-red);
      border-radius:12px; padding:2rem; box-shadow:var(--shadow-card);
    }
    .login-section-title {
      font-family:'Cinzel',serif; font-size:0.7rem; letter-spacing:0.25em;
      color:var(--text-muted); text-align:center; margin-bottom:1.5rem;
    }

    .login-input {
      width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border-red);
      border-radius:8px; color:var(--text); font-family:'Noto Sans JP',sans-serif;
      font-size:1rem; padding:0.85rem 1rem; outline:none; margin-bottom:0.8rem;
      transition:border-color 0.2s, box-shadow 0.2s; box-sizing:border-box;
    }
    .login-input:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,168,76,0.1); }
    .login-input.error { border-color:var(--red-bright); animation:shake 0.35s ease; }
    @keyframes shake { 0%,100%{transform:none} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

    .err-msg { color:var(--red-bright); font-size:0.8rem; text-align:center; margin-bottom:0.8rem; min-height:1.2em; }

    /* 移動先選択 */
    .dest-label {
      font-family:'Cinzel',serif; font-size:0.68rem; letter-spacing:0.15em;
      color:var(--text-muted); margin-bottom:0.5rem; display:block;
    }
    .dest-btns { display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; margin-bottom:1.4rem; }
    .dest-btn {
      padding:0.65rem 0.5rem; border:1px solid var(--border-red); border-radius:6px;
      background:transparent; color:var(--text-muted); font-family:'Cinzel',serif;
      font-size:0.72rem; letter-spacing:0.05em; cursor:pointer; transition:all 0.2s; text-align:center;
    }
    .dest-btn.selected { border-color:var(--gold); color:var(--gold); background:var(--gold-dim); }
    .dest-btn:hover:not(.selected) { border-color:rgba(201,168,76,0.3); color:var(--text); }

    .back-link {
      display:block; text-align:center; margin-top:1.2rem;
      font-family:'Cinzel',serif; font-size:0.72rem; letter-spacing:0.1em;
      color:var(--text-muted); text-decoration:none; transition:color 0.2s;
    }
    .back-link:hover { color:var(--gold); }
  </style>
</head>
<body>
<div class="suit-deco tl">♠</div>
<div class="suit-deco br">♦</div>

<div class="login-wrap">
  <div class="login-logo">
    <div class="login-logo-title">♠ 不賭死</div>
    <div class="login-logo-sub">Staff Admin Panel</div>
  </div>

  <div class="login-card">
    <div class="login-section-title">— Staff Only —</div>

    <span class="dest-label">移動先ページ</span>
    <div class="dest-btns">
      <button class="dest-btn selected" data-dest="admin-ranking.html" onclick="selectDest(this)">♠ Ranking 管理</button>
      <button class="dest-btn" data-dest="admin-reserve.html" onclick="selectDest(this)">🎟 受付</button>
      <button class="dest-btn" data-dest="obs.html" onclick="selectDest(this)" style="grid-column:span 2">📺 OBS 表示</button>
    </div>

    <input class="login-input" type="email" id="email-input" placeholder="メールアドレス" autocomplete="email" onkeydown="if(event.key==='Enter') document.getElementById('pw-input').focus()">
    <input class="login-input" type="password" id="pw-input" placeholder="パスワード" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()">
    <div class="err-msg" id="err-msg"></div>
    <button class="btn btn-gold" style="width:100%; height:52px; font-size:0.9rem; letter-spacing:0.15em;" id="login-btn" onclick="doLogin()">ENTER ▶</button>
  </div>

  <a class="back-link" href="index.html">← TOPに戻る</a>
</div>

<div id="toast-container"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="common.js"></script>
<script>
let selectedDest = 'admin-ranking.html';

firebase.auth().onAuthStateChanged(async user => {
  if (!user) return;
  try {
    const ok = await hasRole('staff');
    if (ok) { siteLog('login', { dest: selectedDest }); location.replace(selectedDest); }
    else await firebase.auth().signOut();
  } catch(e) {}
});

function selectDest(btn) {
  document.querySelectorAll('.dest-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedDest = btn.dataset.dest;
}

async function doLogin() {
  const email = document.getElementById('email-input').value.trim();
  const pw    = document.getElementById('pw-input').value;
  const errEl = document.getElementById('err-msg');
  const btn   = document.getElementById('login-btn');
  if (!email || !pw) { errEl.textContent = 'メールアドレスとパスワードを入力してください'; return; }
  btn.disabled = true; btn.textContent = 'ログイン中...'; errEl.textContent = '';
  try {
    await signInWithRole(email, pw, 'staff');
    siteLog('login', { dest: selectedDest });
    btn.textContent = '✓ ログイン成功';
    setTimeout(() => location.replace(selectedDest), 400);
  } catch(e) {
    const msg = (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password')
      ? 'メールアドレスまたはパスワードが違います' : e.message;
    errEl.textContent = msg;
    document.getElementById('pw-input').classList.add('error');
    setTimeout(() => document.getElementById('pw-input').classList.remove('error'), 400);
    btn.disabled = false; btn.textContent = 'ENTER ▶';
  }
}
</script>
</body>
</html>
