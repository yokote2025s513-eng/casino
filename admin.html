<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Admin Login ♠ 不賭死</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; }
    .login-wrap { width:min(420px, 92vw); animation:fadeUp 0.4s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }\n    .login-logo { text-align:center; margin-bottom:2rem; }
    .login-logo-icon { font-size:3rem; display:block; margin-bottom:0.5rem; text-shadow:0 0 30px rgba(212,175,55,0.3); color:var(--gold); }
    .login-logo-title { font-family:'Noto Serif JP',serif; font-weight:900; font-size:1.6rem; letter-spacing:0.12em; color:var(--text); }
    .login-logo-sub { font-family:'Cinzel',serif; font-size:0.75rem; letter-spacing:0.2em; color:var(--text-muted); margin-top:0.2rem; }

    .card { background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:2rem; box-shadow:0 20px 50px rgba(0,0,0,0.5); }
    .dest-selector { display:grid; grid-template-columns:1fr 1fr; gap:0.6rem; margin-bottom:1.5rem; }
    .dest-btn {
      background:var(--obsidian-2); border:1px solid var(--border); padding:0.8rem 0.4rem;
      border-radius:4px; text-align:center; cursor:pointer; font-size:0.82rem; font-weight:700; color:var(--text-muted); transition:all 0.2s;
    }
    .dest-btn.selected { border-color:var(--gold); color:var(--gold-light); background:var(--gold-dim); box-shadow:var(--shadow-gold); }
    
    .shake { animation: shake 0.4s ease-in-out; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
  </style>
</head>
<body>

  <div class="login-wrap">
    <div class="login-logo">
      <span class="login-logo-icon">♠</span>
      <div class="login-logo-title">不賭死</div>
      <div class="login-logo-sub">STAFF CONTROL PORTAL</div>
    </div>

    <div class="card" id="login-card">
      <div class="form-group">
        <label>1. 管理画面の選択</label>
        <div class="dest-selector">
          <div class="dest-btn selected" data-dest="admin-reserve.html" onclick="selectDest(this)">♣ 受付・予約管理</div>
          <div class="dest-btn" data-dest="admin-ranking.html" onclick="selectDest(this)">♦ スコアランキング管理</div>
        </div>
      </div>

      <div class="form-group">
        <label for="email-input">メールアドレス</label>
        <input type="email" id="email-input" placeholder="staff@example.com">
      </div>

      <div class="form-group" style="margin-bottom:1.5rem;">
        <label for="pw-input">パスワード</label>
        <input type="password" id="pw-input" placeholder="••••••••">
      </div>

      <div id="err-msg" style="color:var(--crimson-hot); font-size:0.82rem; font-weight:500; margin-bottom:1rem; text-align:center; min-height:1.2rem;"></div>

      <button id="login-btn" onclick="doLogin()" class="btn btn-primary" style="width:100%; padding:0.85rem;">
        <span>安全にログイン ♠</span>
      </button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script>
    const STORAGE_KEY = 'casino_admin_auth';
    let selectedDest = 'admin-reserve.html';

    function selectDest(btn) {
      document.querySelectorAll('.dest-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedDest = btn.dataset.dest;
    }

    async function doLogin() {
      const email = document.getElementById('email-input').value.trim();
      const pw    = document.getElementById('pw-input').value;
      const errEl = document.getElementById('err-msg');
      const btn   = document.getElementById('login-btn');

      if (!email || !pw) {
        errEl.textContent = 'メールアドレスとパスワードを入力してください';
        return;
      }

      if (btn.disabled) return;

      btn.disabled = true;
      btn.textContent = 'ログイン中...';
      errEl.textContent = '';

      try {
        const requiredRole = (selectedDest === 'super-admin.html') ? 'super' : 'staff';
        await signInWithRole(email, pw, requiredRole);

        sessionStorage.setItem(STORAGE_KEY, 'ok');
        btn.textContent = '✓ ログイン成功';
        setTimeout(() => location.replace(selectedDest), 400);

      } catch(e) {
        console.error(e);
        let msg = 'ログインに失敗しました';
        if (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found') {
          msg = 'メールアドレスまたはパスワードが違います';
        } else if (e.message) {
          msg = e.message;
        }
        errEl.textContent = msg;
        
        const card = document.getElementById('login-card');
        card.classList.add('shake');
        setTimeout(() => card.classList.remove('shake'), 400);

        btn.disabled = false;
        btn.textContent = '安全にログイン ♠';
      }
    }

    // 既に認証済みセッションがあればスキップ
    if (sessionStorage.getItem(STORAGE_KEY) === 'ok' && firebase.auth().currentUser) {
      location.replace(selectedDest);
    }
  </script>
</body>
</html>
