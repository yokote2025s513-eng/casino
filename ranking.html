<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランキング ♠ 不賭死</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <style>
    .rank-row {
      display: flex; align-items: center; gap: 1rem; padding: 0.85rem 0;
      border-bottom: 1px solid rgba(212,175,55,0.07); animation: fadeIn 0.3s ease both;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
    .rank-row:last-child { border-bottom: none; }
    .rank-num-big { font-family:'Cinzel',serif; font-size:1.3rem; font-weight:700; width:2.5rem; text-align:center; flex-shrink:0; }
    .rank-1 .rank-num-big { color:#ffd700; text-shadow:0 0 10px rgba(255,215,0,0.5); }
    .rank-2 .rank-num-big { color:#cccccc; text-shadow:0 0 10px rgba(255,255,255,0.3); }
    .rank-3 .rank-num-big { color:#cd7f32; text-shadow:0 0 10px rgba(205,127,50,0.4); }
    .other-rank { color: var(--text-muted); }
    
    .rank-info { flex:1; min-width:0; }
    .rank-name-big { font-size:1.05rem; font-weight:700; color:var(--text); margin-bottom:0.15rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .rank-time { display:flex; align-items:center; gap:0.5rem; font-size:0.75rem; color:var(--text-muted); }
    .rank-score-big { font-family:'Cinzel',serif; font-size:1.4rem; font-weight:700; color:var(--gold-light); text-align:right; }
    .highlight { background: rgba(184,0,0,0.3); color: #fff; padding: 0 2px; border-radius: 2px; font-weight: 700; }
    
    .search-box-wrap { margin: 1.5rem 0 2rem; position: relative; }
    .search-input { width:100%; padding:0.9rem 1rem; font-size:1rem; border-radius:30px; }
    .search-count-lbl { font-size:0.78rem; color:var(--text-muted); font-weight:700; margin-bottom:0.8rem; padding-left:0.5rem; }
    .empty-state { text-align:center; padding:4rem 1rem; color:var(--text-muted); }
    .empty-icon { font-size:2.5rem; margin-bottom:0.5rem; opacity:0.5; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <div class="header-logo">不賭死<span>♠</span></div>
      <nav class="header-nav">
        <a href="index.html">TOP</a>
        <a href="ranking.html" style="color:var(--gold-light)">検索</a>
        <a href="self-reserve.html">順番待ち予約</a>
      </nav>
    </div>
  </header>

  <main class="container" style="max-width:600px; padding-top:2rem; padding-bottom:5rem;">
    <h2 style="font-family:'Noto Serif JP',serif; font-size:1.25rem; text-align:center;">個人スコア検索</h2>
    
    <div class="search-box-wrap">
      <input type="text" id="search-input" class="search-input" placeholder="ニックネームを入力..." oninput="onSearchInput()">
    </div>

    <div id="search-label" class="search-count-lbl" style="display:none;"></div>
    <div id="search-results">
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        名前を入力すると、登録されているすべてのゲームの順位とスコアがリアルタイムに表示されます。
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="common.js"></script>
  <script>
    let allDocs = [];

    async function fetchAllScores() {
      try {
        const snap = await rankingCol().orderBy('score', 'desc').get();
        allDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        // 入力がある状態で再読込された場合の考慮
        if(document.getElementById('search-input').value.trim()) {
          onSearchInput();
        }
      } catch(e) {
        console.error(e);
        showToast('データの取得に失敗しました', 'error');
      }
    }

    function onSearchInput() {
      const q = document.getElementById('search-input').value.trim();
      const resultsEl = document.getElementById('search-results');
      const labelEl = document.getElementById('search-label');

      if (!q) {
        labelEl.style.display = 'none';
        resultsEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔍</div>
            名前を入力すると、登録されているすべてのゲームの順位とスコアがリアルタイムに表示されます。
          </div>`;
        return;
      }

      labelEl.style.display = 'block';
      const ql = q.toLowerCase();
      const hits = allDocs.filter(d => (d.name || '').toLowerCase().includes(ql));
      labelEl.textContent = `「${q}」の検索結果: ${hits.length} 件`;

      if (hits.length === 0) {
        resultsEl.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div>見つかりません</div>';
        return;
      }

      // ゲームごとに順位マップを計算
      const rankMap = {};
      GAMES.forEach(g => {
        let r = 1;
        allDocs.filter(d => d.gameId === g.id).forEach(d => {
          rankMap[d.id] = r++;
        });
      });

      resultsEl.innerHTML = hits.map(it => {
        const g = GAMES.find(x => x.id === it.gameId);
        const highlighted = (it.name || '').replace(
          new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'),
          m => `<span class="highlight">${m}</span>`
        );
        const rank = rankMap[it.id] || '-';
        return `
          <div class="rank-row ${rank <= 3 ? `rank-${rank}` : ''}">
            <div class="rank-num-big ${rank <= 3 ? '' : 'other-rank'}">${rank}</div>
            <div class="rank-info">
              <div class="rank-name-big">${highlighted}</div>
              <div class="rank-time">
                <span class="game-badge game-${it.gameId}">${g?.icon} ${g?.label}</span>
                <span>整理券: ${it.ticketId || '—'}</span>
              </div>
            </div>
            <div class="rank-score-big">${it.score.toLocaleString()}</div>
          </div>`;
      }).join('');
    }

    // 初回ロード
    fetchAllScores();
  </script>
</body>
</html>
