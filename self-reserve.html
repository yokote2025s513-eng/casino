<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>予約 ♠ 不賭死</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; }
    .reserve-wrap { width: min(500px, 94vw); padding: 2rem 0 4rem; }
    .top-logo { text-align: center; margin-bottom: 2rem; }
    .top-logo-title {
      font-family: 'Noto Serif JP', serif; font-weight:900; font-size: 1.6rem; color: var(--gold);
      text-shadow: 0 0 20px rgba(212,175,55,0.4); letter-spacing: 0.08em;
    }
    .top-logo-sub { font-family: 'Libre Baskerville', serif; font-size: 0.7rem; letter-spacing: 0.25em; color: var(--text-muted); margin-top: 0.2rem; }

    .game-sel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-bottom: 1.5rem; }
    .game-sel-btn {
      background: var(--obsidian-2); border: 1px solid var(--border-gold); padding: 1rem 0.5rem;
      border-radius: 6px; text-align: center; cursor: pointer; transition: all 0.2s ease;
    }
    .game-sel-btn.selected { background: var(--gold-dim); border-color: var(--gold-light); box-shadow: var(--shadow-gold); }
    .gs-icon { font-size: 1.4rem; display: block; margin-bottom: 0.3rem; }
    .gs-label { font-size: 0.82rem; font-weight: 700; color: var(--text-warm); }
    .game-sel-btn.selected .gs-label { color: var(--gold-light); }

    .ticket-result-card {
      display: none; background: linear-gradient(135deg, var(--obsidian-3) 0%, var(--obsidian-4) 100%);
      border: 2px dashed var(--gold); border-radius: 8px; padding: 2rem 1.5rem; text-align: center;
      margin-top: 1.5rem; box-shadow: var(--shadow-gold); animation: popIn 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.15) both;
    }
    .ticket-result-card.show { display: block; }
    @keyframes popIn { from { opacity:0; transform:scale(0.92); } to { opacity:1; transform:none; } }
    .tr-head { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; letter-spacing: 0.1em; margin-bottom: 1rem; }
    .tr-game { font-size: 1.1rem; font-weight: 700; color: var(--gold-light); margin-bottom: 0.5rem; }
    .tr-num { font-family: 'Cinzel', serif; font-size: 3.5rem; font-weight: 700; color: var(--text); line-height: 1; margin: 0.8rem 0; text-shadow: 0 0 15px rgba(255,255,255,0.1); }
    .tr-name { font-size: 0.9rem; color: var(--text-warm); }
    .tr-foot { font-size: 0.72rem; color: var(--crimson-hot); margin-top: 1.5rem; border-top: 1px solid rgba(201,168,76,0.15); padding-top: 1rem; }
  </style>
</head>
<body>

  <header class="site-header" style="width:100%">
    <div class="container header-inner">
      <div class="header-logo">不賭死<span>♠</span></div>
      <nav class="header-nav">
        <a href="index.html">TOP</a>
        <a href="ranking.html">検索</a>
        <a href="self-reserve.html" style="color:var(--gold-light)">順番待ち予約</a>
      </nav>
    </div>
  </header>

  <div class="reserve-wrap">
    <div class="top-logo">
      <div class="top-logo-title">不賭死</div>
      <div class="top-logo-sub">WAITING REGISTRATION</div>
    </div>

    <div id="nick-form">
      <div class="form-group">
        <label>1. 参加するゲームを選択</label>
        <div class="game-sel-grid" id="game-buttons"></div>
      </div>

      <div class="form-group">
        <label for="nickname-input">2. ニックネーム（必須）</label>
        <input type="text" id="nickname-input" placeholder="卓に表示される名前" maxlength="15">
        <div id="nick-err" style="color:var(--crimson-hot); font-size:0.75rem; margin-top:0.3rem;"></div>
      </div>

      <button id="submit-btn" onclick="submitSelfReserve()" class="btn btn-primary" style="width:100%; margin-top:1rem; padding:0.9rem;" disabled>
        <span>♦ 予約を確定する</span>
      </button>
    </div>

    <div class="ticket-result-card" id="ticket-result">
      <div class="tr-head">♣ CASINO WAITING TICKET ♣</div>
      <div class="tr-game" id="tr-game">—</div>
      <div class="tr-num" id="tr-num">000</div>
      <div class="tr-name" id="tr-name">—</div>
      <div class="tr-foot">※画面をスクリーンショットしてスタッフにご提示ください</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="common.js"></script>
  <script>
    let selectedGame = null;

    // ゲーム選択ボタンの動的配置
    const btnWrap = document.getElementById('game-buttons');
    btnWrap.innerHTML = GAMES.map(g => `
      <div class="game-sel-btn" data-id="${g.id}" onclick="selectGame('${g.id}')">
        <span class="gs-icon">${g.icon}</span>
        <span class="gs-label">${g.label}</span>
      </div>
    `).join('');

    function selectGame(id) {
      selectedGame = id;
      document.querySelectorAll('.game-sel-btn').forEach(b => {
        b.classList.toggle('selected', b.dataset.id === id);
      });
      validateForm();
    }

    document.getElementById('nickname-input').addEventListener('input', validateForm);

    function validateForm() {
      const name = document.getElementById('nickname-input').value.trim();
      document.getElementById('submit-btn').disabled = !(selectedGame && name.length > 0);
    }

    // トランザクションによる安全な整理番号発券処理
    async function submitSelfReserve() {
      const nickname = document.getElementById('nickname-input').value.trim();
      const errEl = document.getElementById('nick-err');
      const submitBtn = document.getElementById('submit-btn');
      errEl.textContent = '';

      if (!selectedGame || !nickname) return;

      submitBtn.disabled = true;
      submitBtn.textContent = '処理中...';

      const g = GAMES.find(x => x.id === selectedGame);

      try {
        // トランザクション処理の開始（二重発行・番号の重複を完全に防止）
        const finalTicketId = await db.runTransaction(async (transaction) => {
          const globalRef = db.collection('reserves').doc('global');
          const globalSnap = await transaction.get(globalRef);
          
          let currentNext = 1;
          if (globalSnap.exists) {
            currentNext = globalSnap.data().next ?? 1;
          }

          // 最新の整理番号文字列 (例: "042")
          const numStr = String(currentNext).padStart(3, '0');

          // 1. カウンタをインクリメントして上書き
          transaction.set(globalRef, { next: currentNext + 1 }, { merge: true });

          // 2. 予約履歴ドキュメントを追加
          const newReserveRef = db.collection('reserveHistory').doc();
          transaction.set(newReserveRef, {
            gameId: selectedGame,
            ticketId: numStr,
            nickname: nickname,
            done: false,
            source: 'self',
            issuedAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          return numStr;
        });

        // 来場者総数のインクリメント
        await db.collection('visitors').doc('total').set({
          count: firebase.firestore.FieldValue.increment(1),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        // チケットのUI表示
        document.getElementById('tr-game').textContent = `${g.icon} ${g.label}`;
        document.getElementById('tr-num').textContent  = finalTicketId;
        document.getElementById('tr-name').textContent = `👤 ${nickname}`;
        document.getElementById('ticket-result').classList.add('show');
        document.getElementById('nick-form').style.display = 'none';

        document.getElementById('ticket-result').scrollIntoView({ behavior: 'smooth' });
        showToast('予約が完了しました！');

      } catch(e) {
        console.error(e);
        errEl.textContent = '通信エラーが発生しました。もう一度お試しください。';
        submitBtn.disabled = false;
        submitBtn.textContent = '♦ 予約を確定する';
        showToast('エラーが発生しました', 'error');
      }
    }
  </script>
</body>
</html>
