<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS Overaly — 不賭死 ♠ ALL TOP 5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    /* ── 配信専用ベース（1920x1080 固定） ── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --gold:       #d4af37;
      --gold-light: #f0d060;
      --bg-panel:   rgba(10, 4, 5, 0.85);
      
      /* 各ゲームのテーマカラー（ネオン発光用） */
      --color-poker:      #ff003c; /* 鮮烈な赤 */
      --color-blackjack:  #00a2ff; /* 鮮やかな青 */
      --color-chinchiro:  #ff8800; /* 深いオレンジ */
      --color-keiba:      #00ff66; /* 鮮明な緑 */
    }

    html, body {
      width: 1920px; height: 1080px;
      overflow: hidden;
      background: transparent; /* OBS透過用 */
      font-family: 'Noto Sans JP', sans-serif;
      color: #f5ead8;
    }

    /* 全体コンテナ：正確な4分割（2x2グリッド）を構築 */
    .obs-dashboard {
      width: 1920px; height: 1080px;
      padding: 30px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 30px;
      position: relative;
    }

    /* ── 各ゲームパネルのゴリゴリUIデザイン ── */
    .game-panel {
      background: var(--bg-panel);
      border-radius: 12px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      /* パネル共通の影 */
      box-shadow: 0 15px 45px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.6);
      transition: all 0.3s ease;
      animation: popIn 0.4s ease both;
    }
    @keyframes popIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }

    /* 各ゲームごとのネオンエフェクトと枠線 */
    .panel-poker { border: 2px solid rgba(255, 0, 60, 0.3); box-shadow: 0 0 25px rgba(255, 0, 60, 0.1), inset 0 0 10px rgba(255,0,60,0.05); }
    .panel-blackjack { border: 2px solid rgba(0, 162, 255, 0.3); box-shadow: 0 0 25px rgba(0, 162, 255, 0.1), inset 0 0 10px rgba(0,162,255,0.05); }
    .panel-chinchiro { border: 2px solid rgba(255, 136, 0, 0.3); box-shadow: 0 0 25px rgba(255, 136, 0, 0.1), inset 0 0 10px rgba(255,136,0,0.05); }
    .panel-keiba { border: 2px solid rgba(0, 255, 102, 0.3); box-shadow: 0 0 25px rgba(0, 255, 102, 0.1), inset 0 0 10px rgba(0,255,102,0.05); }

    /* パネルヘッダー */
    .panel-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; border-bottom: 2px solid rgba(255,255,255,0.08); padding-bottom: 12px;
    }
    .ph-left { display: flex; align-items: center; gap: 10px; }
    .ph-icon { font-size: 1.8rem; text-shadow: 0 0 15px currentColor; }
    .ph-title { font-family: 'Noto Serif JP', serif; font-weight: 900; font-size: 1.4rem; letter-spacing: 0.1em; }
    .panel-poker .ph-icon { color: var(--color-poker); }
    .panel-blackjack .ph-icon { color: var(--color-blackjack); }
    .panel-chinchiro .ph-icon { color: var(--color-chinchiro); }
    .panel-keiba .ph-icon { color: var(--color-keiba); }

    .ph-count { font-family: 'Cinzel', serif; font-size: 0.8rem; color: var(--gold-light); opacity: 0.8; }

    /* ── ランキング行（通常） ── */
    .rank-rows-wrap {
      display: flex; flex-direction: column; gap: 10px; flex: 1; justify-content: center;
    }
    .rank-item {
      display: flex; align-items: center; gap: 15px;
      background: rgba(255,255,255,0.02);
      padding: 10px 15px; border-radius: 6px;
      animation: slideIn 0.3s ease both;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-15px); } to { opacity: 1; transform: none; } }

    .rank-num {
      font-family: 'Cinzel Decorative', serif; font-size: 1.3rem; font-weight: 900;
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; flex-shrink: 0;
    }
    /* 金銀銅ゴリゴリメダル */
    .med-1 { background: linear-gradient(135deg, #ffd700, #b89700); color: #000; box-shadow: 0 0 15px #ffd700; }
    .med-2 { background: linear-gradient(135deg, #e0e0e0, #7a7a7a); color: #000; }
    .med-3 { background: linear-gradient(135deg, #c97d34, #663600); color: #000; }
    .med-other { color: #888; background: rgba(255,255,255,0.05); font-size: 1rem; }

    /* メーター連動型の名前表示（配信映え） */
    .rank-bar-wrap { flex: 1; position: relative; height: 36px; display: flex; align-items: center; padding-left: 10px; overflow: hidden; border-radius: 4px; background: rgba(0,0,0,0.3); }
    .rank-bar { position: absolute; top: 0; left: 0; height: 100%; opacity: 0.25; transition: width 0.6s cubic-bezier(0.1, 0.8, 0.2, 1); }
    .rank-name { position: relative; z-index: 2; font-weight: 700; font-size: 1.15rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; }
    
    .rank-score { font-family: 'Cinzel', serif; font-size: 1.35rem; font-weight: 700; color: var(--gold-light); text-shadow: 0 0 10px rgba(240,208,96,0.3); text-align: right; min-width: 100px; }

    .empty-msg { text-align: center; color: rgba(255,255,255,0.2); font-size: 0.9rem; padding: 20px 0; font-style: italic; }
  </style>
</head>
<body>

  <div class="obs-dashboard">
    
    <div class="game-panel panel-poker">
      <div class="panel-head">
        <div class="ph-left"><span class="ph-icon">♠</span><span class="ph-title">POKER</span></div>
        <div id="count-poker" class="ph-count">0 Players</div>
      </div>
      <div id="rows-poker" class="rank-rows-wrap">
        <div class="empty-msg">Loading...</div>
      </div>
    </div>
    
    <div class="game-panel panel-blackjack">
      <div class="panel-head">
        <div class="ph-left"><span class="ph-icon">♥</span><span class="ph-title">BLACKJACK</span></div>
        <div id="count-blackjack" class="ph-count">0 Players</div>
      </div>
      <div id="rows-blackjack" class="rank-rows-wrap">
        <div class="empty-msg">Loading...</div>
      </div>
    </div>

    <div class="game-panel panel-chinchiro">
      <div class="panel-head">
        <div class="ph-left"><span class="ph-icon">🎲</span><span class="ph-title">CHINCHIRO</span></div>
        <div id="count-chinchiro" class="ph-count">0 Players</div>
      </div>
      <div id="rows-chinchiro" class="rank-rows-wrap">
        <div class="empty-msg">Loading...</div>
      </div>
    </div>

    <div class="game-panel panel-keiba">
      <div class="panel-head">
        <div class="ph-left"><span class="ph-icon">🏇</span><span class="ph-title">DERBY</span></div>
        <div id="count-keiba" class="ph-count">0 Players</div>
      </div>
      <div id="rows-keiba" class="rank-rows-wrap">
        <div class="empty-msg">Loading...</div>
      </div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    // メダルマッピング
    const medals = ['med-1', 'med-2', 'med-3', 'med-other', 'med-other'];
    const medalLabels = ['Ⅰ', 'Ⅱ', 'Ⅲ', 'Ⅳ', 'Ⅴ']; // メダル風なのでローマ数字

    // ゲームごとの色定義
    const colorMap = {
      poker: 'var(--color-poker)',
      blackjack: 'var(--color-blackjack)',
      chinchiro: 'var(--color-chinchiro)',
      keiba: 'var(--color-keiba)'
    };

    // ── 全ゲームリアルタイム監視 ──
    const targetGames = ['poker', 'blackjack', 'chinchiro', 'keiba'];

    targetGames.forEach(gameId => {
      db.collection('rankings')
        .where('gameId', '==', gameId)
        .orderBy('score', 'desc')
        .onSnapshot(snap => {
          const docs = snap.docs.map(d => d.data());
          
          // 参加人数の更新
          const countEl = document.getElementById(`count-${gameId}`);
          if (countEl) countEl.textContent = `${docs.length} 人参加`;

          // トップ5を切り出し
          const top5 = docs.slice(0, 5);
          renderList(gameId, top5);
        }, err => {
          console.error(`OBS Firebase Error (${gameId}):`, err);
        });
    });

    function renderList(gameId, items) {
      const container = document.getElementById(`rows-${gameId}`);
      if (!container) return;

      if (items.length === 0) {
        container.innerHTML = '<div class="empty-msg">— No Score —</div>';
        return;
      }

      const maxScore = items[0]?.score || 1; // プログレスバー用
      const themeColor = colorMap[gameId];

      container.innerHTML = items.map((it, i) => {
        // スコアメーターの幅計算（最低でも5%確保）
        const pct = Math.min(100, Math.max(5, (it.score / maxScore) * 100));
        return `
          <div class="rank-item">
            <div class="rank-num ${medals[i]}">${medalLabels[i]}</div>
            <div class="rank-bar-wrap">
              <div class="rank-bar" style="width: ${pct}%; background: ${themeColor};"></div>
              <div class="rank-name">${it.name || '—'}</div>
            </div>
            <div class="rank-score">${it.score.toLocaleString()}</div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
