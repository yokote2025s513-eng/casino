<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS — 不賭死</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* OBS専用の配置制御スタイル（1920x1080固定、背景透過） */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent !important; /* OBSで背後を綺麗に抜くための透過設定 */
      font-family: 'Noto Sans JP', sans-serif;
    }

    /* 2×2の均等4分割配置（以前のコードの機能構造を維持） */
    .obs-grid-wrapper {
      width: 1920px;
      height: 1080px;
      padding: 35px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 30px;
    }

    /* index.html の .ranking-card スタイルをベースにしたボード定義 */
    .ranking-card {
      margin: 0 !important; /* グリッド配置のためマージンをリセット */
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--obsidian-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      animation: cardFadeUp 0.5s ease both;
    }
    @keyframes cardFadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: none; }
    }

    /* 各ゲームカードのヘッダーデザイン */
    .ranking-card-head {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border-gold-dim);
      margin-bottom: 1.5rem;
    }
    .rch-icon {
      font-size: 1.8rem;
      color: var(--gold-light);
      text-shadow: 0 0 10px var(--gold-dim);
    }
    .rch-title {
      font-family: 'Noto Serif JP', serif;
      font-weight: 900;
      font-size: 1.4rem;
      color: var(--gold-light);
      letter-spacing: 0.05em;
    }
    .rch-count {
      margin-left: auto;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-family: 'Cinzel', serif;
    }

    /* ランキング行のコンテナ */
    .rank-rows-container {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      flex: 1;
      justify-content: center; /* 上下に偏らず美しく中央寄せ */
    }

    /* ranking.html の .rank-row スタイルと同一の見た目を採用 */
    .rank-row {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(212,175,55,0.07);
    }
    .rank-row:last-child {
      border-bottom: none;
    }

    /* 順位数字（金銀銅・その他）のフォント定義 */
    .rank-num-big {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      font-weight: 700;
      width: 2.5rem;
      text-align: center;
      flex-shrink: 0;
    }
    /* 金・銀・銅・4位以下のカラー定義を継承 */
    .rank-1 .rank-num-big { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
    .rank-2 .rank-num-big { color: #cccccc; text-shadow: 0 0 10px rgba(204,204,204,0.3); }
    .rank-3 .rank-num-big { color: #cd7f32; text-shadow: 0 0 10px rgba(205,127,50,0.3); }
    .other-rank .rank-num-big { color: var(--text-muted); font-size: 1.1rem; }

    /* プレイヤー名エリア */
    .rank-name-big {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    /* スコア表示（右端） */
    .rank-score-val {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--gold-light);
      text-align: right;
      min-width: 120px;
    }
    .score-unit {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 1.5rem 0;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="obs-grid-wrapper">
    
    <div class="ranking-card game-poker" id="panel-poker">
      <div class="ranking-card-head">
        <span class="rch-icon">♠</span>
        <span class="rch-title">ポーカー</span>
        <span class="rch-count" id="count-poker">0人参加</span>
      </div>
      <div class="rank-rows-container" id="rows-poker">
        <div class="empty-state">データを読み込み中...</div>
      </div>
    </div>
    
    <div class="ranking-card game-blackjack" id="panel-blackjack">
      <div class="ranking-card-head">
        <span class="rch-icon">♥</span>
        <span class="rch-title">ブラックジャック</span>
        <span class="rch-count" id="count-blackjack">0人参加</span>
      </div>
      <div class="rank-rows-container" id="rows-blackjack">
        <div class="empty-state">データを読み込み中...</div>
      </div>
    </div>

    <div class="ranking-card game-chinchiro" id="panel-chinchiro">
      <div class="ranking-card-head">
        <span class="rch-icon">🎲</span>
        <span class="rch-title">チンチロ</span>
        <span class="rch-count" id="count-chinchiro">0人参加</span>
      </div>
      <div class="rank-rows-container" id="rows-chinchiro">
        <div class="empty-state">データを読み込み中...</div>
      </div>
    </div>

    <div class="ranking-card game-keiba" id="panel-keiba">
      <div class="ranking-card-head">
        <span class="rch-icon">¼</span>
        <span class="rch-title">競馬</span>
        <span class="rch-count" id="count-keiba">0人参加</span>
      </div>
      <div class="rank-rows-container" id="rows-keiba">
        <div class="empty-state">データを読み込み中...</div>
      </div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    // 順位付け用のメタデータ
    const medals = ['🥇', '🥈', '🥉', '4', '5'];
    const targetGames = ['poker', 'blackjack', 'chinchiro', 'keiba'];

    // ── 4つのゲームを独立してリアルタイム監視（onSnapshot） ──
    targetGames.forEach(gameId => {
      db.collection('rankings')
        .where('gameId', '==', gameId)
        .orderBy('score', 'desc')
        .onSnapshot(snap => {
          const docs = snap.docs.map(d => d.data());
          
          // 各カードヘッダー内の「○人参加」の文字数を動的リアルタイム更新
          const countEl = document.getElementById(`count-${gameId}`);
          if (countEl) countEl.textContent = `${docs.length}人参加`;

          // トップ5をきれいにスライスして描画
          const top5 = docs.slice(0, 5);
          renderMatchedRows(gameId, top5);
        }, err => {
          console.error(`Firebase OBS Error [${gameId}]:`, err);
        });
    });

    // 元のフロントエンドのHTMLタグ構造に完全準拠させたレンダリング
    function renderMatchedRows(gameId, items) {
      const container = document.getElementById(`rows-${gameId}`);
      if (!container) return;

      if (items.length === 0) {
        container.innerHTML = '<div class="empty-state">— まだデータがありません —</div>';
        return;
      }

      container.innerHTML = items.map((it, i) => {
        // 1〜3位と4〜5位で適用するクラスを出し分け
        const rankClass = (i < 3) ? `rank-${i + 1}` : 'other-rank';
        const displayNum = (i < 3) ? (i + 1) : (i + 1); // 以前のデザインに合わせたプレーンなインデックス

        return `
          <div class="rank-row ${rankClass}">
            <div class="rank-num-big">${displayNum}</div>
            <div class="rank-info" style="flex:1; display:flex; align-items:center;">
              <div class="rank-name-big">${it.name || '—'}</div>
            </div>
            <div class="rank-score-val">
              ${it.score.toLocaleString()}<span class="score-unit">pt</span>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
