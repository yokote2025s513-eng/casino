<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS — 不賭死</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --gold:       #d4af37;
      --gold-light: #f0d060;
      --bg:         #0a0a0f;
      --poker:      #e74c3c;
      --blackjack:  #3498db;
      --chinchiro:  #e67e22;
      --keiba:      #27ae60;
    }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent; font-family: 'Noto Sans JP', sans-serif;
    }
    .bg {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 50%, rgba(10,10,15,0) 30%, rgba(5,2,3,0.85) 100%);
      pointer-events: none; z-index: 1;
    }

    /* メイン4カラムレイアウト */
    .dashboard {
      position: relative; z-index: 2; width: 100%; height: 100%;
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 25px; padding: 40px; background: transparent;
    }

    .game-panel {
      background: rgba(12, 4, 5, 0.75); border: 2px solid rgba(212,175,55,0.2);
      border-radius: 12px; padding: 24px; display: flex; flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8); backdrop-filter: blur(12px);
      position: relative; overflow: hidden;
    }
    .game-panel::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
    }
    .panel-poker::before { background: var(--poker); }
    .panel-blackjack::before { background: var(--blackjack); }
    .panel-chinchiro::before { background: var(--chinchiro); }
    .panel-keiba::before { background: var(--keiba); }

    /* パネルヘッダー */
    .panel-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 14px;
    }
    .panel-title { font-size: 26px; font-weight: 700; color: #fff; letter-spacing: 0.05em; display: flex; align-items: center; gap: 10px; }
    .panel-icon { font-size: 28px; }
    .panel-count { font-family: 'Cinzel', serif; font-size: 16px; color: #888; font-weight: 600; }

    /* 各行スタイル */
    .rows-wrap { flex: 1; display: flex; flex-direction: column; gap: 15px; justify-content: flex-start; }
    .rank-item {
      display: flex; align-items: center; gap: 15px; height: 64px; position: relative;
    }
    .rank-num {
      width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
      font-family: 'Cinzel Decorative', serif; font-size: 22px; font-weight: 900; border-radius: 50%;
    }
    .rank-1-box { color: #ffd700; text-shadow: 0 0 12px rgba(255,215,0,0.6); }
    .rank-2-box { color: #e5e5e5; text-shadow: 0 0 12px rgba(255,255,255,0.4); }
    .rank-3-box { color: #ca7a36; text-shadow: 0 0 12px rgba(202,122,54,0.5); }
    .rank-other-box { color: #666; font-size: 18px; }

    .rank-bar-wrap { flex: 1; position: relative; height: 100%; display: flex; align-items: center; }
    .rank-bar {
      position: absolute; left: 0; top: 10px; bottom: 10px; border-radius: 4px;
      opacity: 0.15; transition: width 0.6s cubic-bezier(0.19, 1, 0.22, 1);
    }
    .rank-name {
      position: relative; z-index: 2; font-size: 20px; font-weight: 500; color: #e0e0e5;
      padding-left: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px;
    }
    .rank-score {
      font-family: 'Cinzel', serif; font-size: 24px; font-weight: 700; color: var(--gold-light);
      text-align: right; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .empty-msg { text-align: center; color: #555; font-size: 18px; padding-top: 100px; font-style: italic; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="dashboard" id="board-grid"></div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    // OBS専用設定
    const GAMES_OBS = [
      { id: "poker",     label: "POKER",       icon: "♠", color: "var(--poker)" },
      { id: "blackjack", label: "BLACKJACK",   icon: "♥", color: "var(--blackjack)" },
      { id: "chinchiro", label: "CHINCHIRO",   icon: "🎲", color: "var(--chinchiro)" },
      { id: "keiba",     label: "DERBY",       icon: "🏇", color: "var(--keiba)" }
    ];

    const boardEl = document.getElementById('board-grid');
    boardEl.innerHTML = GAMES_OBS.map(g => `
      <div class="game-panel panel-${g.id}" id="panel-${g.id}">
        <div class="panel-head">
          <div class="panel-title"><span class="panel-icon" style="color:${g.color}">${g.icon}</span>${g.label}</div>
          <div class="panel-count" id="count-${g.id}">0人</div>
        </div>
        <div class="rows-wrap" id="rows-${g.id}">
          <div class="empty-msg">— CONNECTING —</div>
        </div>
      </div>
    `).join('');

    const medals = ['Ⅰ', 'Ⅱ', 'Ⅲ', 'Ⅳ', 'Ⅴ'];
    const rankCls = ['rank-1-box', 'rank-2-box', 'rank-3-box', 'rank-other-box', 'rank-other-box'];
    const allRankings = {};

    function renderRows(gameId, items) {
      const el = document.getElementById(`rows-${gameId}`);
      document.getElementById(`count-${gameId}`).textContent = items.length + ' 人';

      if (items.length === 0) {
        el.innerHTML = '<div class="empty-msg">— まだスコアがありません —</div>';
        return;
      }
      const top = items.slice(0, 5);
      const maxScore = top[0]?.score || 1;
      
      el.innerHTML = top.map((it, i) => `
        <div class="rank-item">
          <div class="rank-num ${rankCls[i]}">${medals[i]}</div>
          <div class="rank-bar-wrap">
            <div class="rank-bar" style="width:${(it.score / maxScore * 100).toFixed(1)}%; background:${GAMES_OBS.find(x => x.id === gameId).color}"></div>
            <div class="rank-name">${it.name}</div>
          </div>
          <div class="rank-score">${it.score.toLocaleString()}</div>
        </div>`).join('');
    }

    // 各ゲームのFirestoreリアルタイム購読
    GAMES_OBS.forEach(g => {
      db.collection('rankings')
        .where('gameId', '==', g.id)
        .orderBy('score', 'desc')
        .onSnapshot(snap => {
          allRankings[g.id] = snap.docs.map(d => d.data());
          renderRows(g.id, allRankings[g.id]);
        }, e => console.error("OBS Snapshot Error: ", e));
    });
  </script>
</body>
</html>
